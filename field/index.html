<div id="pv" class="preview" hidden>미리보기 모드 — 서버 연결 전이라 글·사진이 이 기기에만 저장돼요. (관리 화면 미리보기 비밀번호 0000)</div>

<script>
"use strict";
/* ============ 기본 ============ */
const Q = new URLSearchParams(location.search);
const CODE = (Q.get("s") || "").trim();
const ADMIN = Q.has("admin");
const API = (window.FIELD_API || "").trim();
const BASE = location.origin + location.pathname;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DEF_STAGES = ["철거","설비","전기","목공","타일","도장","마감"];
const WD = "일월화수목금토";
let PW = ""; try { PW = localStorage.getItem("field_pw") || ""; } catch (e) {}
let NAME = ""; try { NAME = localStorage.getItem("field_name") || ""; } catch (e) {}
let D = null; // {site, posts, comments}
const PHOTO = {}; // id -> dataURL
if (!API) $("#pv").hidden = false;

function today() { const d = new Date(Date.now() + 9 * 3600e3); return d.toISOString().slice(0, 10); }
function nowStr() { const d = new Date(Date.now() + 9 * 3600e3); return d.toISOString().slice(0, 19).replace("T", " "); }
function fmtDay(s) { const d = new Date(s + "T00:00:00"); if (isNaN(d)) return s; return (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + WD[d.getDay()] + ")"; }
function fmtDate(s) { return s ? s.replace(/-/g, ".") : ""; }
function toast(m, ms) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), ms || 2200); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("복사했어요. 카톡에 붙여 넣으세요"); return; } catch (e) {}
  const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("복사했어요. 카톡에 붙여 넣으세요"); } catch (e) { prompt("아래 내용을 길게 눌러 복사하세요", text); }
  ta.remove();
}
function pct(stages) {
  if (!stages || !stages.length) return 0;
  const v = stages.reduce((a, s) => a + (s.s === 2 ? 1 : s.s === 1 ? .5 : 0), 0);
  return Math.round(v / stages.length * 100);
}
const ST_TXT = ["대기", "진행 중", "완료"];
function custUrl(code) { return BASE + "?s=" + code; }
function kakaoText(site) {
  return "[홈퍼니싱] " + site.name + " 현장 소통 페이지입니다.\n공사 진행 사진과 내용을 이곳에서 날마다 확인하실 수 있고, 궁금한 점이나 요청은 댓글로 남겨 주시면 담당자가 답변드립니다.\n" + custUrl(site.code);
}

/* ============ 서버 연결 ============ */
async function call(a, data) {
  data = Object.assign({ a }, data || {});
  if (!API) return Local.call(a, data);
  let r;
  for (let i = 0; i < 2; i++) {
    try {
      const res = await fetch(API, { method: "POST", body: JSON.stringify(data), headers: { "Content-Type": "text/plain;charset=utf-8" } });
      r = await res.json(); break;
    } catch (e) { if (i) throw new Error("연결이 늦어요. 잠시 뒤 다시 해 주세요"); await new Promise(f => setTimeout(f, 1200)); }
  }
  if (!r.ok) throw new Error(r.error || "오류");
  return r;
}

/* ============ 미리보기(서버 연결 전) — 이 기기에만 저장 ============ */
const Local = (() => {
  const KEY = "field_preview_v1", PKEY = "field_preview_ph_";
  const TEST_CODE = "WI7ijOiMEPHIOf4vjkqEPmG2", PWD = "0000";
  let db = null;
  function load() {
    if (db) return db;
    try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    if (!db) { db = seed(); save(); }
    return db;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { throw new Error("이 기기 저장 공간이 꽉 찼어요"); } }
  function putPhoto(id, url) { try { localStorage.setItem(PKEY + id, url); } catch (e) { throw new Error("이 기기 저장 공간이 꽉 찼어요 (미리보기는 사진 20장 정도까지)"); } }
  function uid(p) { return p + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function code24() { const a = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789", u = new Uint8Array(24); crypto.getRandomValues(u); return Array.from(u, b => a[b % 62]).join(""); }
  function site(code) { const s = load().sites.find(x => x.code === code && !x.hidden); if (!s) throw new Error("주소를 확인해 주세요"); return s; }
  function pub(s) { const { code, name, manager, phone, address, start, end, stages, status } = s; return { code, name, manager, phone, address, start, end, stages, status }; }
  function admin(d) { if (d.pw !== PWD) throw new Error("비밀번호가 맞지 않아요"); }
  function bundle(code, isAdmin, seen) {
    const b = load();
    return {
      posts: b.posts.filter(p => p.code === code && (isAdmin || !p.hidden)).map(p => Object.assign({}, p, { isNew: !!(isAdmin && p.by === "c" && p.createdAt > (seen || "")) })),
      comments: b.comments.filter(c => c.code === code && (isAdmin || !c.hidden)).map(c => Object.assign({}, c, { isNew: !!(isAdmin && c.by === "c" && c.createdAt > (seen || "")) }))
    };
  }
  const A = {
    site: d => { const s = site(d.s); return Object.assign({ site: pub(s) }, bundle(s.code, false)); },
    photo: d => { const r = {}; (d.ids || []).forEach(id => { const u = localStorage.getItem(PKEY + id); if (u) r[id] = u; }); return { photos: r }; },

function compress(file) {
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", .8));
    };
    im.onerror = () => { URL.revokeObjectURL(url); no(new Error("사진을 읽지 못했어요 (" + file.name + ")")); };
    im.src = url;
  });
}

  if (ADMIN) {
    box.innerHTML = '<h2>오늘 공정 올리기</h2><div class="row"><div><label class="f">날짜</label><input type="date" id="wDate" value="' + today() + '"></div><div><label class="f">공정</label><select id="wStage">' + s.stages.map(x => '<option>' + esc(x.n) + '</option>').join("") + '<option value="">기타·공지</option></select></div></div>'
      + '<label class="f">작성자</label><input type="text" id="wAuthor" value="' + esc(s.manager || "홈퍼니싱") + '"><label class="f">내용</label><textarea id="wText" placeholder="오늘 한 일, 내일 할 일, 고객이 알아야 할 점"></textarea><label class="check"><input type="checkbox" id="wImp"> 중요 사항으로 표시 (맨 위 \'중요 사항\'에 모여요)</label><div id="wPick"></div><button class="btn pri big" id="wGo">올리기</button><div class="status" id="wSt"></div>';
  } else {
    box.innerHTML = '<h2>현장에 글 남기기</h2><div class="chips" id="wKind"><button type="button" class="chip on">질문</button><button type="button" class="chip">요청</button><button type="button" class="chip">의견</button></div>'
      + '<textarea id="wText" placeholder="궁금한 점이나 요청 사항을 남겨 주세요. 담당자가 확인하고 답변드려요."></textarea><div id="wPick" style="margin-top:8px"></div><label class="f">이름 (선택)</label><input type="text" id="wAuthor" maxlength="20" placeholder="예: 김OO 고객" value="' + esc(NAME) + '"><button class="btn pri big" id="wGo" style="margin-top:12px">올리기</button><div class="status" id="wSt"></div>';
    $("#wKind").onclick = e => { if (e.target.classList.contains("chip")) { box.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === e.target)); } };
  }
  const pk = picker($("#wPick"));
  $("#wGo").onclick = async () => {
    const st = $("#wSt"), btn = $("#wGo"), text = $("#wText").value.trim();
    if (!text && !pk.files.length) { st.className = "status err"; st.textContent = "내용을 적거나 사진을 골라 주세요"; return; }
    btn.disabled = true; st.className = "status";
    try {
      const author = $("#wAuthor").value.trim();
      if (!ADMIN) { NAME = author; try { localStorage.setItem("field_name", author); } catch (e) {} }
      const photos = await uploadAll(pk.files, st, ADMIN);
      st.textContent = "저장 중…";
      if (ADMIN) await call("adminPost", { s: CODE, pw: PW, date: $("#wDate").value, stage: $("#wStage").value, author, text, important: $("#wImp").checked, photos });
      else await call("post", { s: CODE, text, photos, author, kind: ($(".chip.on", box) || {}).textContent });
      pk.clear(); toast("올렸어요"); await refresh();
    } catch (e) { st.className = "status err"; st.textContent = e.message + " — 다시 눌러 주세요"; btn.disabled = false; }
  };
}
async function refresh() { const y = scrollY; await openSite(); scrollTo(0, y); }
function bindSite() {
  const app = $("#app");
  app.onclick = async e => {
    const t = e.target.closest("button,li[data-go]"); if (!t) return;
    if (t.dataset.go) { const el = $("#p-" + t.dataset.go); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    if (t.dataset.pid) { const post = D.posts.find(p => p.id === t.dataset.post); if (post && PHOTO[t.dataset.pid]) lightbox(post.photos.filter(id => PHOTO[id]), Math.max(0, post.photos.filter(id => PHOTO[id]).indexOf(t.dataset.pid))); return; }
    if (t.id === "pdfBtn") return makePdf();
    if (t.id === "talkGo") { const w = $("#write"); w.scrollIntoView({ behavior: "smooth", block: "start" }); setTimeout(() => { const ta = $("#wText"); if (ta) ta.focus({ preventScroll: true }); }, 400); return; }
    if (!ADMIN) return;
    try {
      if (t.dataset.i != null && t.classList.contains("stg")) { const x = D.site.stages[+t.dataset.i]; x.s = (x.s + 1) % 3; t.className = "stg s" + x.s; t.textContent = x.n + " · " + ST_TXT[x.s]; $("#stgSave").hidden = false; const p = pct(D.site.stages); $(".pct").textContent = p + "%"; $(".prog .bar i").style.width = p + "%"; return; }
      if (t.id === "stgSave") { t.disabled = true; await call("updateSite", { s: CODE, pw: PW, fields: { stages: D.site.stages } }); toast("진행률을 저장했어요"); t.hidden = true; t.disabled = false; return; }
      if (t.dataset.imp) { await call("editPost", { s: CODE, pw: PW, id: t.dataset.imp, important: t.dataset.v === "1" }); return refresh(); }
      if (t.dataset.hide) { if (t.dataset.v === "1" && !confirm("이 글을 고객 화면에서 숨길까요? (지워지지 않고 관리 화면에는 남아요)")) return; await call("editPost", { s: CODE, pw: PW, id: t.dataset.hide, hidden: t.dataset.v === "1" }); return refresh(); }
      if (t.dataset.hc) { await call("editComment", { s: CODE, pw: PW, id: t.dataset.hc, hidden: t.dataset.v === "1" }); return refresh(); }
      if (t.dataset.edit) { const p = D.posts.find(x => x.id === t.dataset.edit); editText(p); return; }
    } catch (err) { toast(err.message); }
  };
  app.onsubmit = async e => {
    const f = e.target.closest(".cform"); if (!f) return; e.preventDefault();
    const inp = $("input", f), text = inp.value.trim(); if (!text) return;
    const b = $("button", f); b.disabled = true;
    try {
      await call("comment", Object.assign({ s: CODE, postId: f.dataset.post, text }, ADMIN ? { pw: PW, author: D.site.manager || "홈퍼니싱" } : { author: NAME || "고객" }));
      await refresh();
    } catch (err) { toast(err.message); b.disabled = false; }
  };
}
function editText(p) {
  const m = modal('<h2>내용 고치기</h2><textarea id="eT" style="min-height:160px">' + esc(p.text) + '</textarea><div class="meta" style="margin:6px 0 12px">고치기 전 내용은 기록에 남아요.</div><div class="row"><button class="btn" data-close>취소</button><button class="btn pri" id="eGo">저장</button></div>');
  $("#eGo", m).onclick = async () => { try { await call("editPost", { s: CODE, pw: PW, id: p.id, text: $("#eT", m).value }); m.remove(); refresh(); } catch (e) { toast(e.message); } };
}
function modal(html) {
  const m = document.createElement("div"); m.className = "modal"; m.innerHTML = '<div class="box">' + html + '</div>';
  m.addEventListener("click", e => { if (e.target === m || e.target.hasAttribute("data-close")) m.remove(); });
  document.body.appendChild(m); return m;
}

/* ============ 관리 화면 ============ */
function logout() { PW = ""; try { localStorage.removeItem("field_pw"); } catch (e) {} $("#bar").innerHTML = ""; loginView(); }
function loginView(msg) {
  $("#app").innerHTML = '<div class="brandbar"><b>HOME FURNISHING</b><span>현장 소통 · 관리</span></div><section class="card" style="max-width:380px;margin:40px auto 0"><h2>관리 화면</h2><div class="meta">회사 직원만 들어갈 수 있어요.</div><form id="lf"><label class="f">관리 비밀번호</label><input type="password" id="lp" autocomplete="current-password"><button class="btn pri big" style="margin-top:12px">들어가기</button><div class="status err" id="ls">' + esc(msg || "") + '</div></form></section>';
  $("#lf").onsubmit = async e => {
    e.preventDefault(); const pw = $("#lp").value.trim(); if (!pw) return;
    try { await call("login", { pw }); PW = pw; try { localStorage.setItem("field_pw", pw); } catch (x) {} route(); } catch (x) { $("#ls").textContent = x.message; }
  };
}
function adminBar() {
  const s = D.site;
  $("#bar").innerHTML = '<div class="adminbar"><span>관리 모드</span><a class="btn sm" href="?admin">← 현장 목록</a><button class="btn sm pri" id="abCopy">고객 주소 복사</button><button class="btn sm" id="abView">고객 화면 보기</button><button class="btn sm" id="abEdit">현장 정보</button>' + (API ? '<button class="btn sm" id="abFolder">사진 폴더</button>' : '') + '</div>';
  $("#abCopy").onclick = () => shareModal(s);
  $("#abView").onclick = () => window.open(custUrl(s.code), "_blank");
  $("#abEdit").onclick = () => siteForm(s);
  if (API) $("#abFolder").onclick = async () => { try { const r = await call("folder", { s: CODE, pw: PW }); window.open(r.url, "_blank"); } catch (e) { toast(e.message); } };
}
function shareModal(s, fresh) {
  const m = modal('<h2>' + (fresh ? "현장을 만들었어요" : "고객 주소") + '</h2><div class="meta">' + esc(s.name) + ' — 이 주소를 카톡으로 한 번 보내면 고객이 가입 없이 들어와요.</div><div class="urlbox">' + esc(custUrl(s.code)) + '</div><button class="btn pri big" id="shK">카톡용 안내문 복사</button><div class="row" style="margin-top:8px"><button class="btn" id="shU">주소만 복사</button><a class="btn" href="?admin&s=' + esc(s.code) + '">현장 열기</a></div><div class="meta" style="margin-top:10px">주소를 아는 사람은 누구나 볼 수 있어요. 고객에게만 보내 주세요.</div><button class="btn ghost big" data-close style="margin-top:6px">닫기</button>');
  $("#shK", m).onclick = () => copy(kakaoText(s));
  $("#shU", m).onclick = () => copy(custUrl(s.code));
}
function siteForm(s) {
  const isNew = !s; s = s || { name: "", manager: "", phone: "", address: "", start: today(), end: "", stages: DEF_STAGES.map(n => ({ n, s: 0 })) };
  let stages = s.stages.map(x => Object.assign({}, x));
  const m = modal('<h2>' + (isNew ? "현장 추가" : "현장 정보") + '</h2>'
    + '<label class="f">현장 이름 (고객 화면 맨 위)</label><input type="text" id="fN" value="' + esc(s.name) + '" placeholder="예: 반포 OO아파트 34평">'
    + '<div class="row"><div><label class="f">담당자</label><input type="text" id="fM" value="' + esc(s.manager) + '" placeholder="정진혁 실장"></div><div><label class="f">연락처</label><input type="tel" id="fP" value="' + esc(s.phone) + '" placeholder="010-0000-0000"></div></div>'
    + '<label class="f">주소 (고객 화면에 보임 — 동·호수는 빼는 걸 권해요)</label><input type="text" id="fA" value="' + esc(s.address) + '">'
    + '<div class="row"><div><label class="f">착공일</label><input type="date" id="fS" value="' + esc(s.start) + '"></div><div><label class="f">준공 예정일</label><input type="date" id="fE" value="' + esc(s.end) + '"></div></div>'
    + '<label class="f">공정 단계 (누르면 빼기)</label><div class="chips" id="fSt"></div><div class="row"><input type="text" id="fAdd" placeholder="단계 추가 (예: 샷시)"><button class="btn" id="fAddB" style="flex:none">추가</button></div>'
    + '<div class="status err" id="fErr"></div><div class="row" style="margin-top:10px"><button class="btn" data-close>취소</button><button class="btn pri" id="fGo">' + (isNew ? "만들기" : "저장") + '</button></div>');
  const draw = () => $("#fSt", m).innerHTML = stages.map((x, i) => '<button type="button" class="chip on" data-i="' + i + '">' + esc(x.n) + ' ×</button>').join("") || '<span class="meta">단계를 추가해 주세요</span>';
  draw();
  $("#fSt", m).onclick = e => { const i = e.target.dataset.i; if (i != null) { stages.splice(+i, 1); draw(); } };
  $("#fAddB", m).onclick = () => { const v = $("#fAdd", m).value.trim(); if (v) { stages.push({ n: v, s: 0 }); $("#fAdd", m).value = ""; draw(); } };
  $("#fGo", m).onclick = async () => {
    const f = { name: $("#fN", m).value.trim(), manager: $("#fM", m).value.trim(), phone: $("#fP", m).value.trim(), address: $("#fA", m).value.trim(), start: $("#fS", m).value, end: $("#fE", m).value, stages };
    if (!f.name) { $("#fErr", m).textContent = "현장 이름을 적어 주세요"; return; }
    $("#fGo", m).disabled = true;
    try {
      if (isNew) { const r = await call("addSite", Object.assign({ pw: PW }, f)); m.remove(); shareModal(Object.assign({ code: r.code }, f), true); listView(); }
      else { await call("updateSite", { s: CODE, pw: PW, fields: f }); m.remove(); toast("저장했어요"); refresh(); }
    } catch (e) { $("#fErr", m).textContent = e.message; $("#fGo", m).disabled = false; }
  };
}
async function listView() {
  const app = $("#app");
  $("#bar").innerHTML = '<div class="adminbar"><span>관리 모드</span><button class="btn sm" id="abOut">나가기</button></div>';
  $("#abOut").onclick = logout;
  let r;
  try { r = await call("sites", { pw: PW }); } catch (e) { if (/비밀번호|잠겼/.test(e.message)) return logout(); app.innerHTML = '<div class="gate">' + esc(e.message) + '</div>'; return; }
  const list = r.sites.sort((a, b) => (b.newCount - a.newCount) || (b.createdAt || "").localeCompare(a.createdAt || ""));
  let h = '<div class="brandbar"><b>HOME FURNISHING</b><span>현장 소통 · 관리</span></div><h1>현장 목록</h1><div class="meta">고객이 글·사진을 올리면 \'새 글\'이 붙어요.</div>';
  h += '<button class="btn pri big" id="addS" style="margin-top:12px">+ 현장 추가</button><div class="slist">';
  if (!list.length) h += '<div class="empty">아직 현장이 없어요.</div>';
  list.forEach(s => {
    const p = pct(s.stages);
    h += '<div class="sc"><div class="t"><strong>' + esc(s.name) + '</strong>' + (s.newCount ? '<span class="tag n">새 글 ' + s.newCount + '</span>' : '') + '</div>'
      + '<div class="meta">' + esc(s.manager || "") + (s.start ? " · " + fmtDate(s.start) + " ~ " + fmtDate(s.end) : "") + ' · 기록 ' + (s.postCount || 0) + '건</div>'
      + '<div class="bar"><i style="width:' + p + '%"></i></div><div class="meta">진행률 ' + p + '%</div>'
      + '<div class="acts"><a class="btn pri" href="?admin&s=' + esc(s.code) + '">열기</a><button class="btn" data-share="' + esc(s.code) + '">고객 주소 복사</button></div></div>';
  });
  app.innerHTML = h + '</div>' + footerHtml();
  $("#addS").onclick = () => siteForm(null);
  app.onclick = e => { const c = e.target.dataset.share; if (c) shareModal(list.find(x => x.code === c)); };
}

/* ============ PDF ============ */
async function makePdf() {
  const st = $("#pdfSt"), btn = $("#pdfBtn"); btn.disabled = true; st.className = "status";
  try {
    st.textContent = "PDF 준비 중… (사진 불러오는 중)";
    await loadLib();
    const s = D.site, posts = D.posts.filter(p => !p.hidden), cms = D.comments.filter(c => !c.hidden);
    await loadAllPhotos(posts.flatMap(p => p.photos || []));
    const days = [...new Set(posts.map(p => p.date))].sort();
    const imp = posts.filter(p => p.important);
    const nPh = posts.reduce((a, p) => a + (p.photos || []).length, 0);
    const p = pct(s.stages);
    let h = '<div class="pd"><div class="cover"><div class="top">HOME FURNISHING · ártico studio</div><div class="k">CONSTRUCTION RECORD</div><h1>' + esc(s.name) + '</h1><div class="sub">현장 기록</div>'
      + '<dl><dt>공사 기간</dt><dd>' + fmtDate(s.start) + ' ~ ' + fmtDate(s.end) + '</dd><dt>현장 담당</dt><dd>' + esc(s.manager) + (s.phone ? ' (' + esc(s.phone) + ')' : '') + '</dd>' + (s.address ? '<dt>주소</dt><dd>' + esc(s.address) + '</dd>' : '') + '<dt>기록</dt><dd>' + days.length + '일 · 글 ' + posts.length + '건 · 사진 ' + nPh + '장</dd><dt>작성일</dt><dd>' + fmtDate(today()) + '</dd></dl>'
      + '<div class="ft">공간을 설계하는 홈퍼니싱 · 취향을 디자인하는 아르띠꼬 · 상담 1566-5904<br>ⓒ HOME FURNISHING CO. all rights reserved.</div></div>';
    h += '<div class="sec brk"><h2>공정 요약</h2><table><tr><th style="width:40%">단계</th><th>상태</th><th>기록된 날</th></tr>' + s.stages.map(x => {
      const ds = [...new Set(posts.filter(q => q.stage === x.n).map(q => q.date))].sort();
      return '<tr><td>' + esc(x.n) + '</td><td>' + ST_TXT[x.s] + '</td><td>' + (ds.length ? fmtDate(ds[0]).slice(5) + (ds.length > 1 ? " ~ " + fmtDate(ds[ds.length - 1]).slice(5) : "") : "-") + '</td></tr>';
    }).join("") + '</table><p>공정 진행률 <b>' + p + '%</b> (완료 1, 진행 중 0.5로 계산)</p>';
    h += '<h2 style="margin-top:22px">중요 사항</h2>' + (imp.length ? imp.map(x => '<div class="impi"><small>' + fmtDay(x.date) + (x.stage ? " · " + esc(x.stage) : "") + '</small>' + esc(x.text) + '</div>').join("") : '<p>없음</p>') + '</div>';
    h += '<div class="sec brk"><h2>날짜별 기록</h2>';
    days.forEach(d => {
      h += '<div class="dh">' + fmtDay(d) + ' · ' + d.slice(0, 4) + '</div>';
      posts.filter(x => x.date === d).sort((a, b) => a.createdAt.localeCompare(b.createdAt)).forEach(x => {
        const who = x.by === "c" ? (x.author || "고객") + " (고객 " + (x.kind || "의견") + ")" : (x.author || "홈퍼니싱") + (x.stage ? " · " + x.stage : "");
        h += '<div class="pp"><div class="hd pdf-avoid"><b>' + esc(who) + '</b> ' + esc((x.createdAt || "").slice(11, 16)) + (x.important ? ' · <b style="color:#b5472f">중요</b>' : '') + '</div>';
        if (x.text) h += '<div class="tx pdf-avoid">' + esc(x.text) + '</div>';
        const ph = (x.photos || []).filter(id => PHOTO[id]);
        for (let i = 0; i < ph.length; i += 2) h += '<div class="pg pdf-avoid">' + ph.slice(i, i + 2).map(id => '<img src="' + PHOTO[id] + '">').join("") + '</div>';
        cms.filter(c => c.postId === x.id).sort((a, b) => a.createdAt.localeCompare(b.createdAt)).forEach(c => h += '<div class="cm pdf-avoid"><b>' + esc(c.author || (c.by === "a" ? "홈퍼니싱" : "고객")) + '</b> ' + esc(c.text) + ' <span style="color:#7d7064">' + esc((c.createdAt || "").slice(5, 16)) + '</span></div>');
        h += '</div>';
      });
    });
    h += '</div></div>';
    const root = $("#pdfroot"); root.innerHTML = h;
    await Promise.all([...root.querySelectorAll("img")].map(im => im.complete ? 0 : new Promise(f => { im.onload = im.onerror = f; })));
    st.textContent = "PDF 만드는 중… (사진이 많으면 30초쯤 걸려요)";
    const fileBase = "현장기록 " + s.name + " " + today();
    const y0 = scrollY; scrollTo(0, 0);
    const worker = html2pdf().set({ margin: [12, 12, 14, 12], image: { type: "jpeg", quality: .85 }, html2canvas: { scale: 1.6, backgroundColor: "#fff", scrollX: 0, scrollY: 0, windowWidth: 760 }, jsPDF: { unit: "mm", format: "a4" }, pagebreak: { mode: ["css", "legacy"], avoid: ".pdf-avoid" } }).from(root.firstChild).toPdf();
    const pdf = await worker.get("pdf"); scrollTo(0, y0);
    const n = pdf.internal.getNumberOfPages();
    for (let i = 2; i <= n; i++) { pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(140); pdf.text((i - 1) + " / " + (n - 1), 105, 290, { align: "center" }); }
    let name = fileBase + ".pdf", saved = "";
    if (ADMIN) {
      st.textContent = "드라이브에 저장 중…";
      const r = await call("savePdf", { s: CODE, pw: PW, data: pdf.output("datauristring") });
      name = r.name; saved = r.local ? "미리보기라 드라이브 저장은 서버 연결 후에 돼요" : "드라이브 현장 폴더에 저장했어요";
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(pdf.output("blob")); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
    root.innerHTML = "";
    st.textContent = name + (saved ? " — " + saved : " 받기 완료") + " (" + (n) + "장)";
  } catch (e) { st.className = "status err"; st.textContent = "PDF를 만들지 못했어요: " + e.message; }
  btn.disabled = false;
}
function loadLib() {
  if (window.html2pdf) return Promise.resolve();
  return new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"; sc.onload = ok; sc.onerror = () => no(new Error("PDF 도구를 불러오지 못했어요")); document.head.appendChild(sc); });
}

/* ============ 시작 ============ */
function route() {
  if (ADMIN) { if (!PW) return loginView(); return CODE ? openSite() : listView(); }
  if (!CODE) { $("#app").innerHTML = '<div class="gate"><div><div class="kicker">HOME FURNISHING</div><p>받으신 주소로 들어와 주세요.</p></div></div>'; return; }
  openSite();
}
route();
