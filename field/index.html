<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f5f0e8">
<title>현장 소통 · 홈퍼니싱</title>
<link rel="icon" type="image/png" sizes="32x32" href="../site/images/favicon-32.png">
<link rel="apple-touch-icon" href="../site/images/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f5f0e8;--paper:#fffdf9;--ink:#2a2420;--sub:#7d7064;--line:#e3dace;--pt:#9a7b56;--pt2:#7c6141;--soft:#efe7da;
  --cust:#eef3f7;--custline:#cfdbe6;--custink:#2f4f6a;--imp:#b5472f;--impbg:#fbefe9;--ok:#4f7a5a;--new:#d9822b;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body{word-break:keep-all;overflow-wrap:anywhere}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pt2)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
.preview{background:#fff4d6;color:#6b5414;font-size:13px;text-align:center;padding:7px 12px;border-bottom:1px solid #f0dfa8}
.brandbar{display:flex;justify-content:space-between;align-items:center;padding:16px 0 12px;font-size:12px;color:var(--sub);letter-spacing:.06em}
.brandbar b{font-weight:600;color:var(--ink);letter-spacing:.12em}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-top:12px}
h1{font-size:23px;line-height:1.35;margin:4px 0 6px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 10px;font-weight:700}
.kicker{font-size:12px;color:var(--pt);letter-spacing:.14em;font-weight:600}
.meta{font-size:13px;color:var(--sub)}
.mgr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.mgr .who{flex:1;min-width:140px}
.mgr .who small{display:block;font-size:12px;color:var(--sub)}
.mgr .who strong{font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);min-height:40px}
.btn.pri{background:var(--pt2);border-color:var(--pt2);color:#fff}
.btn.big{width:100%;padding:13px;font-size:16px;min-height:50px}
.btn.sm{padding:5px 10px;font-size:13px;min-height:32px;border-radius:8px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.55;cursor:default}
.prog{margin-top:14px}
.prog .top{display:flex;justify-content:space-between;align-items:baseline}
.prog .pct{font-size:26px;font-weight:700;color:var(--pt2);font-variant-numeric:tabular-nums}
.prog .lbl{font-size:13px;color:var(--sub)}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pt),var(--pt2));border-radius:99px;transition:width .4s}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;padding:0;list-style:none}
.stg{font-size:13px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--sub);display:inline-flex;align-items:center;gap:5px}
.stg::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;flex:none}
.stg.s1{color:var(--pt2);border-color:var(--pt);background:#fbf4ea;font-weight:600}
.stg.s1::before{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.stg.s2{color:var(--ok);border-color:#b9cfbe;background:#f1f6f2}
.stg.s2::before{background:currentColor}
button.stg{cursor:pointer;min-height:34px}
.legend{font-size:12px;color:var(--sub);margin-top:8px}
/* v10: 확정 마감재·도면 */
.spec{border:2px solid var(--pt2)}.spec h2 .ver{font-size:14px;color:var(--pt2);margin-left:6px}
.spec table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}.spec td,.spec th{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top;word-break:break-all}.spec th{font-size:12px;color:var(--sub);font-weight:600;border-top:0}
.spec .sfs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:12px}.spec .sf{border:1px solid var(--line);border-radius:10px;background:var(--bg,#f6f6f4);min-height:96px;padding:0;overflow:hidden;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:stretch;justify-content:center}
.spec .sf img{width:100%;height:96px;object-fit:cover;display:block}.spec .sf span{font-size:12px;padding:6px;word-break:break-all;text-align:center}.spec .sf b{display:block;font-size:13px;color:var(--pt2)}
.spec .seen{margin-top:14px;padding:12px;border-radius:10px;background:var(--bg,#f6f6f4);font-size:15px}.spec .seen.ok{font-weight:700}.spec #specOk{margin-top:14px;min-height:56px;font-size:18px}
.imp{border-color:#efcdbf;background:var(--impbg)}
.imp h2{color:var(--imp)}
.imp ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.imp li{background:#fff;border:1px solid #f1d8cd;border-radius:10px;padding:10px 12px;cursor:pointer}
.imp li small{display:block;font-size:12px;color:var(--sub)}
.imp li span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:14px;cursor:pointer;min-height:36px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
textarea,input[type=text],input[type=tel],input[type=date],input[type=password],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px}
textarea{min-height:96px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:10px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--imp)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.thumbs div{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--soft)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.status{font-size:13px;color:var(--sub);min-height:1.3em;margin-top:6px}
.status.err{color:var(--imp)}
.lgsep{display:flex;align-items:center;gap:8px;margin:18px 0 4px;font-size:12px;color:var(--sub)}.lgsep:before,.lgsep:after{content:"";flex:1;border-top:1px solid var(--line)}
.names{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
.names .btn{min-height:64px;font-size:19px}
.dots{display:flex;justify-content:center;gap:12px;margin:16px 0 6px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pt2)}.dots i.on{background:var(--pt2)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.kp button{min-height:62px;font-size:24px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;touch-action:manipulation}
.kp button.fn{font-size:15px;background:var(--soft)}
.kp button.go{background:var(--pt2);border-color:var(--pt2);color:#fff;font-size:16px}
.pinrow{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:#fff}
.pinrow .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.st-ok{color:var(--ok);font-weight:700}.st-lock,.st-block{color:var(--imp);font-weight:700}
.newdev{display:inline-block;background:var(--imp);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px}
.plog{font-size:13px;border-top:1px solid var(--line);padding:6px 0}
.day{margin-top:26px}
.dayh{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--pt2);margin-bottom:8px}
.dayh::after{content:"";flex:1;height:1px;background:var(--line)}
.post{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;scroll-margin-top:70px}
.post.c{background:var(--cust);border-color:var(--custline)}
.post.isimp{border-color:#e4b4a2;box-shadow:inset 3px 0 0 var(--imp)}
.post.hid{opacity:.5}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.ph .nm{font-weight:700}
.post.c .ph .nm{color:var(--custink)}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--pt2);font-weight:600}
.post.c .tag{background:#dde8f1;color:var(--custink)}
.tag.i{background:var(--imp);color:#fff}
.tag.n{background:var(--new);color:#fff}
.tag.h{background:#888;color:#fff}
.ph time{margin-left:auto;color:var(--sub);font-size:12px}
.txt{margin-top:8px;white-space:pre-line}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.pics.one{grid-template-columns:1fr}
.pics button{padding:0;border:0;background:var(--soft);border-radius:10px;overflow:hidden;aspect-ratio:4/3;cursor:zoom-in;position:relative}
.pics.one button{aspect-ratio:auto;min-height:160px}
.pics img{width:100%;height:100%;object-fit:cover;display:block}
.pics.one img{height:auto}
.pics button.ld::after{content:"사진 불러오는 중";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--sub)}
.cmts{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
.cmt{font-size:14px;padding:6px 0;display:flex;gap:8px;align-items:flex-start}
.cmt .b{flex:1;min-width:0}
.cmt .b b{font-size:13px;margin-right:6px}
.cmt.a .b b{color:var(--pt2)}
.cmt.c .b b{color:var(--custink)}
.cmt small{color:var(--sub);font-size:11px;margin-left:4px}
.cmt.hid{opacity:.45}
.cform{display:flex;gap:6px;margin-top:8px}
.cform input{flex:1;padding:8px 10px;font-size:15px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:14px}
footer{margin-top:40px;text-align:center;font-size:12px;color:var(--sub);line-height:1.8}
footer b{color:var(--ink);font-weight:600;letter-spacing:.06em}
.adminbar{position:sticky;top:0;z-index:20;background:rgba(42,36,32,.96);color:#fff;padding:8px 12px;display:flex;gap:6px;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch}
.adminbar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3);white-space:nowrap;flex:none}
.adminbar .btn.pri{background:#fff;color:var(--ink)}
.adminbar span{font-size:12px;opacity:.7;white-space:nowrap;margin-right:auto;padding-right:6px}
.slist{display:grid;gap:10px;margin-top:12px}
.sc{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
.sc .t{display:flex;align-items:center;gap:8px}
.sc .t strong{font-size:16px;flex:1}
.sc .bar{height:7px}
.sc .acts{display:flex;gap:6px;margin-top:10px}
.sc .acts .btn{flex:1}
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,16,12,.55);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){.modal{align-items:center}.modal .box{border-radius:18px}}
.urlbox{background:#fff;border:1px dashed var(--pt);border-radius:10px;padding:10px;font-size:13px;word-break:break-all;margin:10px 0;user-select:all}
.lb{position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb .x,.lb .p,.lb .n{position:absolute;border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:50%;width:44px;height:44px;font-size:22px;cursor:pointer}
.lb .x{top:calc(12px + env(safe-area-inset-top));right:12px}
.lb .p{left:10px;top:50%}.lb .n{right:10px;top:50%}
.lb .cnt{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#ddd;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:70;max-width:90vw;text-align:center}
.gate{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--sub);font-size:14px}
.loading{padding:60px 0;text-align:center;color:var(--sub)}
/* 고객 공유 (2026-11-18 v1): 확인 번호 · 결제 일정 · 공정표 · 시공 전·중·후 사진 */
.pin{max-width:360px;margin:40px auto 0;text-align:center}
.pin input{font-size:28px;letter-spacing:.5em;text-align:center;padding:12px 8px 12px 20px}
.pays{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.pays td,.pays th{padding:9px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
.pays th{font-size:12px;color:var(--sub);font-weight:600;border-top:0}
.pays .n{text-align:right;white-space:nowrap}
.pays tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.pst{font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap;font-weight:600}
.pst.ok{background:#e6f0e8;color:var(--ok)}.pst.due{background:var(--soft);color:var(--pt2)}.pst.late{background:var(--impbg);color:var(--imp)}
.sched{display:grid;gap:6px;font-size:14px}
.sched .r{display:grid;grid-template-columns:5.5em 1fr auto;gap:8px;align-items:center}
.sched .r b{font-weight:600}
.sched .r small{color:var(--sub);font-variant-numeric:tabular-nums}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal button{padding:0;border:0;background:var(--soft);border-radius:8px;overflow:hidden;aspect-ratio:1;cursor:zoom-in;position:relative}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal button.ld::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--soft),#f8f3ea,var(--soft))}
.prow{display:grid;grid-template-columns:1.1fr 1.3fr 1.2fr auto;gap:6px;align-items:center;margin-top:6px}
.prow input{padding:8px;font-size:15px}
.prow label{display:flex;gap:4px;align-items:center;font-size:13px;white-space:nowrap}
.srow{display:grid;grid-template-columns:4.5em 1fr 1fr;gap:6px;align-items:center;margin-top:6px;font-size:14px}
.srow input{padding:7px;font-size:14px}
@media(max-width:420px){.prow{grid-template-columns:1fr 1fr}.gal{grid-template-columns:repeat(2,1fr)}}
/* PDF 만들기용 (화면 밖) */
#pdfroot{position:fixed;left:-12000px;top:0;width:718px;background:#fff}
.pd{width:718px;color:#2a2420;font-family:var(--sans);font-size:12.5px;line-height:1.6;background:#fff}
.pd .cover{height:1000px;display:flex;flex-direction:column;justify-content:center;padding:0 40px;border:1px solid #e3dace}
.pd .cover .k{font-size:12px;letter-spacing:.3em;color:#9a7b56}
.pd .cover h1{font-size:34px;margin:16px 0 8px}
.pd .cover .sub{font-size:16px;color:#7d7064}
.pd .cover dl{display:grid;grid-template-columns:90px 1fr;gap:8px 0;margin-top:40px;font-size:14px}
.pd .cover dt{color:#7d7064}.pd .cover dd{margin:0}
.pd .cover .ft{margin-top:auto;padding-bottom:36px;font-size:11px;color:#7d7064}
.pd .cover .top{padding-top:36px;margin-bottom:auto;font-size:12px;letter-spacing:.14em;font-weight:600}
.pd h2{font-size:17px;border-bottom:2px solid #2a2420;padding-bottom:6px;margin:0 0 12px}
.pd .sec{padding-top:6px}
.pd table{width:100%;border-collapse:collapse;font-size:12.5px}
.pd th,.pd td{border:1px solid #e3dace;padding:6px 8px;text-align:left}
.pd th{background:#f5f0e8;font-weight:600}
.pd .impi{border-left:3px solid #b5472f;background:#fbefe9;padding:8px 10px;margin-bottom:8px;white-space:pre-line}
.pd .impi small{display:block;color:#7d7064}
.pd .dh{font-size:15px;font-weight:700;color:#7c6141;margin:18px 0 6px;border-bottom:1px solid #e3dace;padding-bottom:4px}
.pd .pp{margin:6px 0 10px}
.pd .pp .hd{font-size:12px;color:#7d7064}
.pd .pp .hd b{color:#2a2420}

function uaSum() {
  const u = navigator.userAgent || "";
  const os = /iPhone/.test(u) ? "아이폰" : /iPad/.test(u) ? "아이패드" : /Android/.test(u) ? "안드로이드" : /Windows/.test(u) ? "윈도우 PC" : /Mac OS X|Macintosh/.test(u) ? "맥" : "기타";
  const br = /KAKAOTALK/i.test(u) ? "카카오톡" : /NAVER/.test(u) ? "네이버" : /SamsungBrowser/.test(u) ? "삼성 인터넷" : /Edg\//.test(u) ? "엣지" : /Firefox|FxiOS/.test(u) ? "파이어폭스" : /Chrome|CriOS/.test(u) ? "크롬" : /Safari/.test(u) ? "사파리" : "브라우저";
  return os + " · " + br;
}
function tkSet(t) { TK = String(t); try { sessionStorage.setItem("field_tk", TK); } catch (e) {} PW = "T:" + TK; }
function devForget() { DEV = ""; try { localStorage.removeItem("field_dev"); localStorage.removeItem("field_dev_who"); } catch (e) {} }
async function devIn() {
  try { const r = await call("devLogin", { dev: DEV }); if (!r.token) return false; tkSet(r.token); return true; }
  catch (e) { // 서버가 확실히 무효라고 할 때(DEVBAD:)만 기억을 지움 · 잠시 문제(DEVWAIT:)·연결 오류는 그대로 둠 (검토 반영)
    const m = String(e.message || "");
    if (/^DEVBAD:/.test(m)) { devForget(); toast(m.slice(7), 3500); }
    else toast((/^DEVWAIT:/.test(m) ? m.slice(8) : m) + " · 이 기기 기억은 그대로예요", 3500);
    return false; }
}

/* v9: 공정표 추가/수정 — 엑셀(xlsx)·CSV 파일 또는 엑셀에서 복사한 표 붙여넣기 → 미리 보고 고친 뒤 저장.
   onDone 이 있으면(현장 추가 창) 저장하지 않고 그 창에 넘김. 칸: 공정 · 시작일 · 종료일 (11/28 · 2026-11-28 · 11월 28일 모두 됨) */
function schedForm(s, onDone) {
  let rows = ((s && s.stages) || []).map(x => ({ n: x.n, a: x.a || "", b: x.b || "" }));
  const m = modal('<h2>공정표 ' + (rows.length ? "수정" : "추가") + '</h2>'
    + '<div class="meta">엑셀에서 공정표 칸(공정 · 시작일 · 종료일)을 복사해 붙여 넣거나, 파일(xlsx·csv)을 골라 주세요. 읽은 뒤 아래에서 고칠 수 있어요.</div>'
    + '<textarea class="sraw" id="sxT" placeholder="공정\t시작일\t종료일\n철거\t11/28\t11/29\n설비\t11/30\t12/1"></textarea>'
    + '<div class="row" style="margin-top:8px"><label class="btn sxpick" style="flex:1">파일 고르기 (xlsx·csv)<input type="file" id="sxF" accept=".xlsx,.csv,.txt,.tsv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden></label><button class="btn pri" id="sxRead" style="flex:1">표 읽기</button></div>'
    + '<div class="status" id="sxSt"></div><label class="f">공정 · 시작일 · 종료일</label><div id="sxRows"></div><button class="btn sm" id="sxAdd" style="margin-top:6px">+ 공정 줄 추가</button>'
    + '<div class="status err" id="sxErr"></div><div class="row" style="margin-top:10px"><button class="btn" data-close>취소</button><button class="btn pri" id="sxGo">' + (onDone ? "이대로 채우기" : "저장") + '</button></div>');
  const draw = () => $("#sxRows", m).innerHTML = rows.map((x, i) => '<div class="sedit"><input type="text" data-en="' + i + '" value="' + esc(x.n) + '" maxlength="40" aria-label="공정"><input type="date" data-ea="' + i + '" value="' + esc(x.a) + '" aria-label="시작일"><input type="date" data-eb="' + i + '" value="' + esc(x.b) + '" aria-label="종료일"><button type="button" class="btn sm ghost" data-ex="' + i + '" aria-label="줄 빼기">×</button></div>').join("") || '<div class="meta">아직 공정이 없어요.</div>';
  const sync = () => {
    m.querySelectorAll("[data-en]").forEach(el => rows[+el.dataset.en].n = el.value.trim());
    m.querySelectorAll("[data-ea]").forEach(el => rows[+el.dataset.ea].a = el.value);
    m.querySelectorAll("[data-eb]").forEach(el => rows[+el.dataset.eb].b = el.value);
  };
  draw();
  let file = null;
  $("#sxF", m).onchange = e => { file = e.target.files[0] || null; $("#sxSt", m).textContent = file ? file.name + " — ‘표 읽기’를 눌러 주세요" : ""; };
  $("#sxRows", m).onclick = e => { const i = e.target.dataset && e.target.dataset.ex; if (i != null) { sync(); rows.splice(+i, 1); draw(); } };
  $("#sxAdd", m).onclick = () => { sync(); rows.push({ n: "", a: "", b: "" }); draw(); };
  $("#sxRead", m).onclick = async () => {
    const st = $("#sxSt", m), b = $("#sxRead", m), text = $("#sxT", m).value;
    if (!file && !text.trim()) { st.className = "status err"; st.textContent = "표를 붙여 넣거나 파일을 골라 주세요"; return; }
    if (file && file.size > 5 * 1024 * 1024) { st.className = "status err"; st.textContent = "파일이 너무 커요 (5MB까지)"; return; }
    b.disabled = true; st.className = "status"; st.textContent = "읽는 중…";
    try {
      const d = { pw: PW, start: (s && s.start) || "" };
      if (s && s.code) d.s = s.code;
      if (file) { d.file = await readUrl(file); d.fileName = file.name; } else d.text = text;
      const r = await call("schedParse", d);
      if (!r.rows.length) throw new Error((r.warn || [])[0] || "공정 줄을 찾지 못했어요");
      rows = r.rows.map(x => ({ n: x.n, a: x.a || "", b: x.b || "" })); draw();
      st.textContent = r.rows.length + "개 공정을 읽었어요" + ((r.warn || []).length ? " · 확인: " + r.warn.slice(0, 3).join(" / ") : "");
      file = null; $("#sxF", m).value = "";
    } catch (e) { st.className = "status err"; st.textContent = OLD9(e); }
    b.disabled = false;
  };
  $("#sxGo", m).onclick = async () => {
    sync();
    const list = rows.filter(x => x.n);
    if (!list.length) { $("#sxErr", m).textContent = "공정을 하나 이상 넣어 주세요"; return; }
    const bad = list.find(x => x.a && x.b && x.b < x.a); if (bad) { $("#sxErr", m).textContent = bad.n + ": 종료일이 시작일보다 앞이에요"; return; }
    if (onDone) { onDone(list); m.remove(); return; }
    $("#sxGo", m).disabled = true;
    try {
      const r = await call("schedSave", { s: s.code, pw: PW, stages: list });
      m.remove(); toast(r.same ? "바뀐 것이 없어요" : "공정표를 저장했어요 (" + r.stages.length + "개 공정)"); refresh();
    } catch (e) { $("#sxErr", m).textContent = OLD9(e); $("#sxGo", m).disabled = false; }
  };
}

    const nPh = posts.reduce((a, p) => a + (p.photos || []).length, 0);
    const p = pct(s.stages);
    let h = '<div class="pd"><div class="cover"><div class="top">HOME FURNISHING · ártico studio</div><div class="k">CONSTRUCTION RECORD</div><h1>' + esc(s.name) + '</h1><div class="sub">현장 기록</div>'
      + '<dl><dt>공사 기간</dt><dd>' + fmtDate(s.start) + ' ~ ' + fmtDate(s.end) + '</dd><dt>' + (ADMIN ? '현장 담당' : '현장 문의') + '</dt><dd>' + (ADMIN ? esc(s.manager) + (s.phone ? ' (' + esc(s.phone) + ')' : '') : CO_NAME + ' (' + CO_TEL + ')') + '</dd>' + (s.address ? '<dt>주소</dt><dd>' + esc(s.address) + '</dd>' : '') + '<dt>기록</dt><dd>' + days.length + '일 · 글 ' + posts.length + '건 · 사진 ' + nPh + '장</dd><dt>작성일</dt><dd>' + fmtDate(today()) + '</dd></dl>'
      + '<div class="ft">공간을 설계하는 홈퍼니싱 · 취향을 디자인하는 아르띠꼬 · 상담 1566-5904<br>ⓒ HOME FURNISHING CO. all rights reserved.</div></div>';
    h += '<div class="sec brk"><h2>공정 요약</h2><table><tr><th style="width:40%">단계</th><th>상태</th><th>기록된 날</th></tr>' + s.stages.map(x => {
      const ds = [...new Set(posts.filter(q => q.stage === x.n).map(q => q.date))].sort();
      return '<tr><td>' + esc(x.n) + '</td><td>' + ST_TXT[x.s] + '</td><td>' + (ds.length ? fmtDate(ds[0]).slice(5) + (ds.length > 1 ? " ~ " + fmtDate(ds[ds.length - 1]).slice(5) : "") : "-") + '</td></tr>';
    }).join("") + '</table><p>공정 진행률 <b>' + p + '%</b> (완료 1, 진행 중 0.5로 계산)</p>';
    h += '<h2 style="margin-top:22px">중요 사항</h2>' + (imp.length ? imp.map(x => '<div class="impi"><small>' + fmtDay(x.date) + (x.stage ? " · " + esc(x.stage) : "") + '</small>' + esc(x.text) + '</div>').join("") : '<p>없음</p>') + '</div>';
    h += '<div class="sec brk"><h2>날짜별 기록</h2>';
    days.forEach(d => {
      h += '<div class="dh">' + fmtDay(d) + ' · ' + d.slice(0, 4) + '</div>';
      posts.filter(x => x.date === d).sort((a, b) => a.createdAt.localeCompare(b.createdAt)).forEach(x => {
        const who = x.by === "c" ? (x.author || "고객") + " (고객 " + (x.kind || "의견") + ")" : (x.author || "홈퍼니싱") + (x.stage ? " · " + x.stage : "");
        h += '<div class="pp"><div class="hd pdf-avoid"><b>' + esc(who) + '</b> ' + esc((x.createdAt || "").slice(11, 16)) + (x.important ? ' · <b style="color:#b5472f">중요</b>' : '') + '</div>';
        if (x.text) h += '<div class="tx pdf-avoid">' + esc(x.text) + '</div>';
        const ph = (x.photos || []).filter(id => PHOTO[id]);
        for (let i = 0; i < ph.length; i += 2) h += '<div class="pg pdf-avoid">' + ph.slice(i, i + 2).map(id => '<img src="' + PHOTO[id] + '">').join("") + '</div>';
        cms.filter(c => c.postId === x.id).sort((a, b) => a.createdAt.localeCompare(b.createdAt)).forEach(c => h += '<div class="cm pdf-avoid"><b>' + esc(c.author || (c.by === "a" ? "홈퍼니싱" : "고객")) + '</b> ' + esc(c.text) + ' <span style="color:#7d7064">' + esc((c.createdAt || "").slice(5, 16)) + '</span></div>');
        h += '</div>';
      });
    });
    h += '</div></div>';
    const root = $("#pdfroot"); root.innerHTML = h;
    await Promise.all([...root.querySelectorAll("img")].map(im => im.complete ? 0 : new Promise(f => { im.onload = im.onerror = f; })));
    st.textContent = "PDF 만드는 중… (사진이 많으면 30초쯤 걸려요)";
    const fileBase = "현장기록 " + s.name + " " + today();
    const y0 = scrollY; scrollTo(0, 0);
    const worker = html2pdf().set({ margin: [12, 12, 14, 12], image: { type: "jpeg", quality: .85 }, html2canvas: { scale: 1.6, backgroundColor: "#fff", scrollX: 0, scrollY: 0, windowWidth: 760 }, jsPDF: { unit: "mm", format: "a4" }, pagebreak: { mode: ["css", "legacy"], avoid: ".pdf-avoid" } }).from(root.firstChild).toPdf();
    const pdf = await worker.get("pdf"); scrollTo(0, y0);
    const n = pdf.internal.getNumberOfPages();
    for (let i = 2; i <= n; i++) { pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(140); pdf.text((i - 1) + " / " + (n - 1), 105, 290, { align: "center" }); }
    let name = fileBase + ".pdf", saved = "";
    if (ADMIN) {
      st.textContent = "드라이브에 저장 중…";
      const r = await call("savePdf", { s: CODE, pw: PW, data: pdf.output("datauristring") });
      name = r.name; saved = r.local ? "미리보기라 드라이브 저장은 서버 연결 후에 돼요" : "드라이브 현장 폴더에 저장했어요";
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(pdf.output("blob")); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
    root.innerHTML = "";
    st.textContent = name + (saved ? " — " + saved : " 받기 완료") + " (" + (n) + "장)";
  } catch (e) { st.className = "status err"; st.textContent = "PDF를 만들지 못했어요: " + e.message; }
  btn.disabled = false;
}
function loadLib() {
  if (window.html2pdf) return Promise.resolve();
  return new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"; sc.onload = ok; sc.onerror = () => no(new Error("PDF 도구를 불러오지 못했어요")); document.head.appendChild(sc); });
}

/* ============ 시작 ============ */
/* 직원 입장권 확인: 맞으면 출입증을 이 탭에만 두고 관리 화면으로, 틀리면 예전처럼 비밀번호 화면 */
async function ticketIn() {
  const k = TICKET; TICKET = "";
  let msg = "";
  if (!TICKET_RE.test(k)) msg = "직원 입장권을 읽지 못했어요";
  else {
    try { const r = await call("ticket", { k }); if (!r.token) throw new Error("입장권 확인 실패"); TK = String(r.token); try { sessionStorage.setItem("field_tk", TK); } catch (e) {} PW = "T:" + TK; }
    catch (e) { msg = "직원 입장권을 확인하지 못했어요 (" + String(e.message || "").slice(0, 60) + ")"; }
  }
  if (msg && PW) toast(msg + " · 저장된 비밀번호로 들어가요", 3500);
  if (msg && !PW) return loginView(msg + " · 비밀번호로 들어가 주세요");
  route();
}
/* v2: 인트라넷 ‘고객 공유 페이지 열기’ — 프로젝트 번호로 현장 찾기 · 없으면 자동으로 만들기 · 공정표 날짜 맞추기 → 그 현장 관리 화면 */
async function autoOpen() {
  const A = AUTO; AUTO = null;
  $("#app").innerHTML = '<div class="loading">' + (A.m === "spec" ? "확정 마감재·도면을 고객 화면에 올리는 중…" : A.m === "auto" && !CODE ? "인트라넷 프로젝트 " + esc(A.proj) + " 현장 찾는 중…" : "공정 날짜 맞추는 중…") + '</div>';
  let r;
  try {
    r = await call("projSite", { pw: PW, s: CODE || "", proj: A.proj, name: A.name, cust: A.cust, pin: A.pin, manager: A.manager, start: A.start, end: A.end, stages: A.sch });
  } catch (e) {
    if (TK && /입장권|비밀번호/.test(e.message)) { tkDrop(); AUTO = A; if (PW) return route(); $("#bar").innerHTML = ""; loginView(TK_END); return; }
    if (/비밀번호|잠겼/.test(e.message)) { AUTO = A; logout(); return; }
    if (/알 수 없는 요청/.test(e.message)) { toast("현장소통 서버가 옛 버전이에요 (Code.gs v3 이상 배포 필요) · 현장 목록으로 열어요", 4000); if (CODE) return openSite(); return listView(); }
    $("#app").innerHTML = '<div class="gate"><div>' + esc(e.message) + '</div></div>'; return;
  }
  CODE = String(r.code || "");
  try { history.replaceState(null, "", BASE + "?admin&s=" + encodeURIComponent(CODE)); } catch (x) {}
  let specMsg = ""; // v10: 인트라넷 확정본(또는 확정 취소) → 서버에 저장한 뒤 그 현장 화면을 엶
  if (A.m === "spec" && A.spec) {
    try {
      const q = await call("specPush", { pw: PW, s: CODE, proj: A.proj, spec: A.spec });
      if (A.spec.cancel) specMsg = q.cancelled ? "확정 취소를 반영했어요 · 고객 화면에서 확정본을 내렸어요" : "고객 화면에 올라간 확정본이 없어요";
      else specMsg = (q.same ? "같은 확정본 v" + q.ver + " 이 이미 올라가 있어요" : "확정본 v" + q.ver + " 을 고객 화면에 올렸어요 (마감재 " + q.items + "줄 · 파일 " + q.files + "개)") + ((q.skipped || []).length ? " · 못 올린 파일 " + q.skipped.length + "개: " + q.skipped.join(", ").slice(0, 120) : "");
    } catch (e) {
      if (TK && /입장권|비밀번호/.test(e.message)) { tkDrop(); AUTO = A; if (PW) return route(); $("#bar").innerHTML = ""; loginView(TK_END); return; }
      specMsg = /알 수 없는 요청/.test(e.message) ? "현장소통 서버가 옛 버전이에요 (Code.gs v10 배포 필요) · 확정본은 아직 고객 화면에 안 올라갔어요" : "확정본을 올리지 못했어요: " + String(e.message || "").slice(0, 120);
    }
  }
  await openSite();
  if (!D) return;
  if (specMsg) { if (r.created) shareModal(Object.assign({}, D.site, { pinOn: !!r.pinOn }), true); toast(specMsg, 5000); const sc = $("#spec"); if (sc && !r.created) sc.scrollIntoView({ block: "start" }); return; }
  if (r.created) shareModal(Object.assign({}, D.site, { pinOn: !!r.pinOn }), true);
  else toast(r.sched ? "인트라넷 공정표 날짜로 공정 " + r.sched + "단계를 맞췄어요" : (A.m === "auto" ? "이미 만든 현장을 열었어요" : "공정 날짜가 이미 같아요"), 3000);
}
function route() {
  if (ADMIN) {
    if (TICKET) { ticketIn(); return; }
    if (!PW) return loginView();
    if (AUTO && (AUTO.m === "auto" || AUTO.m === "sch" || AUTO.m === "spec")) return autoOpen(); // v10: spec
    if (CODE) return openSite();
    listView().then(ok => { // 인트라넷 '고객 공유 페이지 만들기'(계약 전)에서 # 뒤로 넘어온 값으로 '현장 추가' 창 채우기
      const A = AUTO; if (!ok || !A || A.m !== "new") return; AUTO = null;
      const pre = {}; ["name", "manager", "start", "end", "proj", "cust", "pin"].forEach(k => { if (A[k]) pre[k] = A[k]; });
      if (A.sch.length) pre.stages = A.sch.map(x => ({ n: x.n, s: 0, a: x.a, b: x.b }));
      siteForm(null, pre);
    });
    return;
  }
  if (!CODE) { $("#app").innerHTML = '<div class="gate"><div><div class="kicker">HOME FURNISHING</div><p>받으신 주소로 들어와 주세요.</p></div></div>'; return; }
  openSite();
}
route();
</script>
