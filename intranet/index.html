const todayStr=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const who=id=>id?(names[id]||(id===me.id?(me.name||"나"):"직원")):"—";
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
const staffNames=()=>{const a=S.staff.filter(s=>s.state!=="퇴사").map(s=>s.name).filter(Boolean);return a.length?a:STAFF_DEF};
const staffByName=n=>S.staff.find(s=>s.name===n);
const myStaff=()=>me.id?S.staff.find(s=>s.uid===me.id):null;

// ===== 저장소 (공유 DB, 없으면 이 브라우저 연습 모드) =====
function loadLocal(){try{const r=JSON.parse(localStorage.getItem(LKEY)||"{}");Object.keys(S).forEach(k=>{if(Array.isArray(r[k]))S[k]=r[k]})}catch(e){}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){toast("이 브라우저에 저장하지 못했어요")}}
async function put(col,id,data){
  if(db){await db.collection(col).doc(id).set(data)}
  else{const a=S[col],i=a.findIndex(x=>x.id===id),row=Object.assign({id},data);i<0?a.unshift(row):a[i]=row;saveLocal();render()}
}
async function remove(col,id){
  if(db){await db.collection(col).doc(id).delete()}
  else{S[col]=S[col].filter(x=>x.id!==id);saveLocal();render()}
}
async function logAct(col,action,title){try{await put("activity",newId("a"),{at:nowISO(),by:me.id,col,action,title:String(title||"").slice(0,60)})}catch(e){}}
function sorted(col){return S[col].slice().sort((a,b)=>String(b.updatedAt||b.createdAt||"").localeCompare(String(a.updatedAt||a.createdAt||"")))}

// 결재선: [검토자?, 최종 결재자] 중 지금 차례
function lineOf(r){return [r.reviewer,r.approver].filter(Boolean)}
function curApprover(r){const l=lineOf(r);return l[r.step||0]||""}
function canDecide(r){
  if(!r||!["결재 대기","결재 진행"].includes(r.status||"결재 대기"))return false;
  if(me.isOwner)return true;
  const s=staffByName(curApprover(r));return !!(s&&me.id&&s.uid===me.id);
}
function leaveUsed(name){
  const s=staffByName(name);if(!s)return 0;
  return S.approvals.filter(a=>a.status==="승인"&&a.kind==="휴가신청서"&&a.createdBy&&a.createdBy===s.uid&&["연차","반차"].includes(a.leave)).reduce((t,a)=>t+(a.leave==="반차"?.5:num(a.days)||1),0);
}

async function resolveNames(){
  if(!user)return;
  const ids=new Set();
  Object.keys(S).forEach(c=>S[c].forEach(r=>["createdBy","updatedBy","by","uid"].forEach(k=>r[k]&&ids.add(r[k]))));
  S.approvals.forEach(a=>(a.history||[]).forEach(h=>h.by&&ids.add(h.by)));
  const need=[...ids].filter(i=>!(i in names));
  if(!need.length)return;
  need.forEach(i=>names[i]="");
  try{const ps=await user.profiles(need);let got=0;need.forEach(i=>{const n=ps[i]&&ps[i].name;if(n){names[i]=n;got++}});if(got)render()}catch(e){}
}

  let h=`<a href="#home" ${r==="home"?'aria-current="page"':""}><span>홈</span></a>`,g="";
  NAV_ORDER.forEach(k=>{if(MOD[k].grp!==g){g=MOD[k].grp;h+=`<div class="grp">${esc(g)}</div>`}
    h+=`<a href="#${k}" ${k===r?'aria-current="page"':""}><span>${esc(MOD[k].nav)}</span>${cnt[k]?`<span class="cnt">${cnt[k]}</span>`:""}</a>`;
    if(k==="staff")h+=`<a href="#forms" ${r==="forms"?'aria-current="page"':""}><span>서식 자료실</span></a>`});
  $("#nav").innerHTML=h;
}
function pill(v){return v?`<span class="pill ${TONE[v]||""}">${esc(v)}</span>`:""}
function stageOf(c){
  const done=new Set(c.steps||[]);let first=1;while(done.has(first)&&first<=24)first++;
  const st=STAGES.find(s=>first>=s[2]&&first<=s[3])||STAGES[3];
  return {cur:first>24?24:first,stage:st,done:done.size};
}
function lineHTML(r){
  const l=lineOf(r),st=r.status||"결재 대기",step=r.step||0;
  return `<div class="flow"><span class="done">${esc(who(r.createdBy))} 기안</span>${l.map((n,i)=>{const cls=st==="반려"&&i===step?"no":(st==="승인"||i<step)?"done":i===step?"on":"";return `<span class="${cls}">${esc(n)}${i===l.length-1?" (최종)":""}</span>`}).join("")}</div>`;
}
function cell(r,[k,,t]){
  const v=r[k];
  if(t==="money")return `<td class="num">${won(v)}</td>`;
  if(t==="date")return `<td>${esc(day(v))}</td>`;
  if(t==="person")return `<td>${esc(who(v))}</td>`;
  if(t==="status")return `<td>${pill(v)}</td>`;
  if(t==="line")return `<td>${lineHTML(r)}</td>`;
  if(t==="leave"){const u=leaveUsed(r.name),a=num(r.annual);return `<td class="num">${a?`${u} / ${a}일`:(u?u+"일":"—")}</td>`}
  if(t==="bar"){const p=Math.max(0,Math.min(100,num(v)));return `<td><div class="bar"><i style="width:${p}%"></i></div><small class="muted">${p}%</small></td>`}
  if(t==="stage"){const s=stageOf(r);return `<td>${pill(s.stage[1].split(" · ")[1])}<br><small class="muted">${s.cur}. ${esc(STEP_NAMES[s.cur-1])}</small></td>`}
  if(t==="steps"){const d=(r.steps||[]).length;return `<td><div class="bar"><i style="width:${d/24*100}%"></i></div><small class="muted">${d}/24</small></td>`}
  if(t==="unpaid"){const u=num(r.amt)-num(r.paid);return `<td class="num">${num(r.amt)?(u>0?`<span class="pill warn">${won(u)}</span>`:"완납"):"—"}</td>`}
  const s=String(v??"");return `<td>${esc(s.length>40?s.slice(0,40)+"…":s)}</td>`;
}

  if(f==="__mine")rows=rows.filter(canDecide);else if(f==="__my")rows=rows.filter(a=>me.id&&a.createdBy===me.id);else if(f)rows=rows.filter(r=>stat(r)===f);

}

// ===== 입력 시트 =====
const NOTICE_FIELDS=[["title","제목","text",null,1],["pin","맨 위 고정","sel",["고정"]],["body","내용","area",null,1],["files","첨부","files",null,1]];
let sheet=null; // {col,id,data,hr,files,rows,steps,confirmDel,busy}
function opt(list,v){return `<option value=""></option>`+list.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}
function fieldHTML(f,d,pref){
  const [key,label,type,opts,wide]=f;const v=d[key]??"";const id="f_"+(pref||"")+key;const w=wide?" wide":"";const ds=`data-k="${key}"${pref?` data-p="${pref}"`:""}`;
  if(type==="group"){const g=KIND_GROUP[d.kind]||"pay";return GROUP_FIELDS[g].map(x=>fieldHTML(x,d)).join("")+(g==="pay"?`<div class="f wide"><span class="hint">계좌번호는 적지 말고 통장사본을 첨부하세요. 법인카드는 영수증 사진을 첨부하세요.</span></div>`:"")}
  if(type==="kind")return `<div class="f${w}"><label for="${id}">${label} <span class="hint">본사 서식 기준</span></label><select id="${id}" ${ds}>${DOC_KINDS.reduce((h,k,i,a)=>h+(i===0||a[i-1][0]!==k[0]?(i?"</optgroup>":"")+`<optgroup label="${esc(k[0])}">`:"")+`<option ${k[1]===v?"selected":""}>${esc(k[1])}</option>`,"")}</optgroup></select></div>`;
  if(type==="area")return `<div class="f${w}"><label for="${id}">${label}</label><textarea id="${id}" ${ds}>${esc(v)}</textarea></div>`;
  if(type==="sel")return `<div class="f${w}"><label for="${id}">${label}</label><select id="${id}" ${ds}>${opt(opts,v)}</select></div>`;
  if(type==="staffsel")return `<div class="f${w}"><label for="${id}">${label}</label><select id="${id}" ${ds}>${opt(staffNames(),v)}</select></div>`;
  if(type==="account"){
    if(!me.isOwner||mode!=="shared")return `<div class="f"><label>${label}</label><span class="hint">${v?esc(who(v))+" 계정과 연결됨":"대표가 claude.ai 인트라넷에서 연결해요"}</span></div>`;
    return `<div class="f"><label for="acct">${label} <span class="hint">결재·연차 집계에 필요</span></label><input id="acct" type="search" placeholder="이름으로 계정 찾기" autocomplete="off"><div class="chips" id="acctHits"></div><span class="hint" id="acctNow">${v?"연결됨: "+esc(who(v)):"아직 연결 안 됨"}</span></div>`;
  }
  if(type==="files")return `<div class="f wide"><label>${label}</label><div class="files" id="fileList"></div>${assets?`<input type="file" id="fileIn" multiple accept="image/*,application/pdf,.xlsx,.xls,.docx,.doc,.hwp,.txt,.csv">`:`<span class="hint">파일 올리기는 claude.ai 인트라넷에서 됩니다 (연습 모드에서는 안 됨).</span>`}</div>`;
  if(type==="steps"){let h=`<div class="f wide"><label>${label} <span class="hint">끝난 단계를 체크하면 단계·진행률이 자동으로 바뀝니다</span></label><div class="steps">`;
    STAGES.forEach(s=>{h+=`<div class="grp">${esc(s[1])}</div>`;for(let i=s[2];i<=s[3];i++)h+=`<label><input type="checkbox" data-step="${i}" ${(sheet.steps||[]).includes(i)?"checked":""}> ${i}. ${esc(STEP_NAMES[i-1])}</label>`});
    return h+`</div></div>`}
  if(type==="rows")return `<div class="f wide"><label>${label}</label><div class="rows" id="rows_${key}"></div><div><button class="btn sm" type="button" data-addrow="${key}">+ 한 줄</button></div></div>`;
  const it=type==="date"?"date":type==="num"?"number":type==="url"?"url":"text";
  const val=type==="money"&&v!==""?num(v).toLocaleString("ko-KR"):v;
  return `<div class="f${w}"><label for="${id}">${label}</label><input id="${id}" ${ds} type="${it}" ${type==="money"?'inputmode="numeric" data-money="1"':""} value="${esc(val)}"></div>`;
}
function fieldsOf(col){return col==="notices"?NOTICE_FIELDS:MOD[col].fields}
function allRowFields(col){return fieldsOf(col).concat(col==="staff"&&me.admin?HR_FIELDS:[]).filter(f=>f[2]==="rows")}
function openSheet(col,id,preset){
  const d=id?Object.assign({},(S[col].find(x=>x.id===id)||{})):{};
  const hr=col==="staff"&&id?Object.assign({},(S.hr.find(x=>x.id===id)||{})):{};
  if(!id){
    const mineName=(myStaff()||{}).name||"";
    if(col==="approvals"){d.kind=preset||"기안품의서 (본사)";const fin=S.staff.find(s=>s.role==="최종 결재"&&s.state!=="퇴사");d.approver=fin?fin.name:"최윤수";const rv=S.staff.find(s=>s.role==="검토 (중간 결재)"&&s.state!=="퇴사"&&s.name!==mineName);if(rv)d.reviewer=rv.name}
    if(col==="as"){d.d=todayStr();d.status="접수"}
    if(col==="quotes"){d.status="신규 상담";d.d=todayStr();d.staff=mineName}
    if(col==="sites")d.status="착공 전";
    if(col==="customers"){d.status="진행중";d.mgr=mineName}
    if(col==="manuals")d.ver="v1.0";
    if(col==="staff"){d.state="재직";d.dept="본사";d.role="기안만"}
  }
  const rows={};allRowFields(col).forEach(f=>{const src=HR_FIELDS.includes(f)?hr:d;rows[f[0]]=(src[f[0]]||[]).map(x=>Object.assign({},x))});
  sheet={col,id:id||null,data:d,hr,files:(d.files||[]).slice(),rows,steps:(d.steps||[]).slice(),confirmDel:false,busy:false};
  drawSheet();
}
function sheetLocked(){const {col,id,data:d}=sheet;if(col==="approvals"&&id&&d.status&&d.status!=="결재 대기")return true;if(col==="staff"&&mode==="shared"&&!me.admin)return true;return false}
function drawSheet(){
  if(!sheet){$("#layer").innerHTML="";return}
  const {col,id,data:d}=sheet;const m=MOD[col];
  const title=col==="notices"?(id?"공지":"공지 쓰기"):(id?(m.title+" · "+(d.title||d.name||d.code||d.site||"상세")):m.add);
  const locked=sheetLocked();
  let apBox="";
  if(col==="approvals"&&id){
    const hist=(d.history||[]).map(h=>`<div class="muted">${esc(String(h.at).slice(0,16).replace("T"," "))} · ${esc(h.name||who(h.by))} ${pill(h.result)} ${esc(h.note||"")}</div>`).join("");
    apBox=`<div class="card" style="padding:12px 14px;display:grid;gap:8px"><div class="actions"><div>${pill(d.status||"결재 대기")} <span class="muted">기안 ${esc(who(d.createdBy))} · ${esc(day(d.createdAt))}</span></div></div>${lineHTML(d)}${hist}
    ${canDecide(d)?`<div class="f wide"><label for="decNote">결재 의견 (지금 차례: ${esc(curApprover(d))}${me.isOwner&&staffByName(curApprover(d))&&staffByName(curApprover(d)).uid!==me.id?" · 대표 대결":""})</label><input id="decNote" placeholder="예: 다음 주 발주 진행"></div><div style="display:flex;gap:8px"><button class="btn ok" data-decide="승인">승인</button><button class="btn bad" data-decide="반려">반려</button></div>`:(["결재 대기","결재 진행"].includes(d.status)?`<p class="hint" style="margin:0">지금 결재 차례: ${esc(curApprover(d))}. 인사 관리에서 계정이 연결된 사람과 대표만 결재할 수 있어요.</p>`:"")}</div>`;
  }
  let hrBlock="";
  if(col==="staff"&&me.admin)hrBlock=`<h4>인사기록카드 (대표·편집자만 보임) · 주민번호·계좌번호는 적지 않아요</h4>`+HR_FIELDS.map(f=>fieldHTML(f,sheet.hr,"hr_")).join("");
  if(col==="staff"&&id){const u=leaveUsed(d.name),a=num(d.annual);hrBlock=`<div class="f wide"><span class="hint">연차 사용 (승인된 휴가신청서 기준): ${u}일${a?` / ${a}일 · 남은 ${a-u}일`:""}</span></div>`+hrBlock}
  $("#layer").innerHTML=`<div class="veil" id="veil"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <h3><span>${esc(title)}</span><button class="btn sm" id="closeSheet">닫기</button></h3>
    ${m&&m.sec?`<div class="secnote">${esc(m.sec)}</div>`:""}
    ${apBox}
    <form class="form" id="sheetForm" ${locked?"inert":""}>${fieldsOf(col).map(f=>fieldHTML(f,d)).join("")}${hrBlock}</form>
    <div class="actions">
      <div>${id&&!locked?(sheet.confirmDel?`<span class="muted">정말 지울까요?</span> <button class="btn bad sm" id="delYes">지우기</button> <button class="btn sm" id="delNo">취소</button>`:`<button class="btn bad sm" id="delAsk">삭제</button>`):""}</div>
      <div class="r">${locked?`<span class="muted">${col==="approvals"?"결재가 시작된 서류는 고칠 수 없어요":"보기 전용"}</span>`:`<button class="btn" id="cancelSheet">취소</button><button class="btn pri" id="saveSheet">${id?"저장":(col==="approvals"?"결재 올리기":"등록")}</button>`}</div>
    </div></div></div>`;
  drawFiles();Object.keys(sheet.rows).forEach(drawRows);
}
function drawFiles(){
  const box=$("#fileList");if(!box)return;const locked=sheetLocked();
  box.innerHTML=sheet.files.length?sheet.files.map((f,i)=>{const u="/_blob/"+f.id;const img=/^image\//.test(f.type||"");
    return `<div class="file">${img?`<img src="${esc(u)}" alt="">`:""}<a href="${esc(u)}" target="_blank" rel="noopener">${esc(f.name||"파일")}</a>${locked?"":`<button class="btn sm" type="button" data-rmfile="${i}" aria-label="첨부 빼기">✕</button>`}</div>`}).join(""):`<span class="hint">첨부 없음</span>`;
}
function drawRows(key){
  const box=$("#rows_"+key);if(!box)return;
  const f=allRowFields(sheet.col).find(x=>x[0]===key);const cols=f[3];
  box.innerHTML=sheet.rows[key].map((r,i)=>`<div class="row" style="grid-template-columns:${cols.map(c=>c[4]||"1fr").join(" ")} auto">${cols.map(([k,l,t,o])=>t==="sel"?`<select data-row="${key}" data-i="${i}" data-c="${k}" aria-label="${esc(l)}">${opt(o,r[k])}</select>`:`<input type="${t==="date"?"date":t==="num"?"number":"text"}" data-row="${key}" data-i="${i}" data-c="${k}" value="${esc(r[k]||"")}" placeholder="${esc(l)}" aria-label="${esc(l)}">`).join("")}<button class="btn sm" type="button" data-rmrow="${key}" data-i="${i}" aria-label="줄 지우기">✕</button></div>`).join("")||`<span class="hint">아직 없어요</span>`;
}
function collect(){
  const out={},hr={};
  document.querySelectorAll("#sheetForm [data-k]").forEach(el=>{let v=el.value.trim();if(el.dataset.money)v=v?num(v):"";else if(el.type==="number")v=v===""?"":num(v);(el.dataset.p==="hr_"?hr:out)[el.dataset.k]=v});
  if(fieldsOf(sheet.col).some(f=>f[2]==="files"))out.files=sheet.files;
  allRowFields(sheet.col).forEach(f=>{const clean=sheet.rows[f[0]].filter(r=>Object.values(r).some(x=>String(x||"").trim()));(HR_FIELDS.includes(f)?hr:out)[f[0]]=clean});
  if(sheet.col==="customers"){out.steps=sheet.steps.slice().sort((a,b)=>a-b);out.stage=stageOf(out).stage[0]}
  if(sheet.col==="staff")out.uid=sheet.data.uid||"";
  return {out,hr};
}
const REQUIRED={approvals:["title"],manuals:["title"],notices:["title"],customers:["code"],quotes:["code"],sites:["name"],as:["content"],staff:["name"]};
async function saveSheet(){
  if(sheet.busy)return;
  const {col,id}=sheet;const {out:d,hr}=collect();
  const miss=(REQUIRED[col]||[]).filter(k=>!String(d[k]??"").trim());
  if(miss.length){toast("‘"+((fieldsOf(col).find(f=>f[0]===miss[0])||[0,miss[0]])[1])+"’ 칸을 채워 주세요");return}
  if(col==="approvals"&&!d.approver){toast("‘최종 결재’ 할 사람을 골라 주세요");return}
  if(col==="approvals"&&d.reviewer&&d.reviewer===d.approver)d.reviewer="";
  const base=id?S[col].find(x=>x.id===id)||{}:{};
  const row=Object.assign({},base,d,{updatedAt:nowISO(),updatedBy:me.id});delete row.id;
  if(!id){row.createdAt=row.updatedAt;row.createdBy=me.id;if(col==="approvals"){row.status="결재 대기";row.step=0;row.history=[]}}
  const docId=id||newId(col.slice(0,2));
  sheet.busy=true;
  try{
    await put(col,docId,row);
    if(col==="staff"&&me.admin&&Object.keys(hr).length){const hb=Object.assign({},S.hr.find(x=>x.id===docId)||{},hr,{updatedAt:nowISO(),updatedBy:me.id});delete hb.id;await put("hr",docId,hb)}
    logAct(col,id?"수정":(col==="approvals"?"결재 요청":"등록"),row.title||row.name||row.code||row.site||"");
    toast(id?"저장했어요":(col==="approvals"?"결재를 올렸어요":"등록했어요"));sheet=null;drawSheet();
  }catch(e){sheet.busy=false;toast(e&&e.code==="not_granted"?"이 링크는 보기 권한이라 저장할 수 없어요. 대표에게 권한을 요청해 주세요":"저장하지 못했어요. 잠시 후 다시 눌러 주세요")}
}
async function decide(result){
  const {col,id}=sheet;const base=S[col].find(x=>x.id===id);if(!base||!canDecide(base)||sheet.busy)return;
  const note=(($("#decNote")||{}).value||"").trim();
  const l=lineOf(base),step=base.step||0,name=l[step];
  const hist=(base.history||[]).concat([{at:nowISO(),by:me.id,name,result,note}]);
  const last=step>=l.length-1;
  const status=result==="반려"?"반려":(last?"승인":"결재 진행");
  const row=Object.assign({},base,{status,step:result==="승인"&&!last?step+1:step,history:hist,updatedAt:nowISO(),updatedBy:me.id});delete row.id;
  sheet.busy=true;
  try{await put(col,id,row);logAct(col,result==="반려"?"반려":(last?"최종 승인":"검토 승인"),base.title);toast(result==="반려"?"반려했어요":(last?"최종 승인했어요":"승인했어요 · 다음 결재자에게 넘어갔어요"));sheet=null;drawSheet()}
  catch(e){sheet.busy=false;toast("결재를 저장하지 못했어요")}
}
async function uploadFiles(list){
  if(!assets)return;
  for(const f of list){
    if(f.size>20*1024*1024){toast(f.name+" : 20MB가 넘어 올릴 수 없어요");continue}
    try{toast("올리는 중… "+f.name);const r=await assets.upload(f);sheet.files.push({id:r.id,name:f.name,type:r.contentType||f.type,size:r.sizeBytes||f.size});drawFiles()}
    catch(e){toast(e&&e.code==="not_granted"?"파일을 올릴 권한이 없어요":"파일을 올리지 못했어요: "+f.name)}
  }
}
let acctTimer=null;
function acctSearch(q){
  clearTimeout(acctTimer);
  acctTimer=setTimeout(async()=>{
    const box=$("#acctHits");if(!box||!user||!user.search)return;
    let hits=[];try{hits=await user.search(q)}catch(e){}
    box.innerHTML="";
    hits.filter(h=>h.id).slice(0,6).forEach(h=>{const b=document.createElement("button");b.type="button";b.className="chip";b.dataset.acct=h.id;b.dataset.acctname=h.name||"";b.textContent="+ "+(h.name||"이름 없음");box.appendChild(b)});
    if(!box.children.length){const s=document.createElement("span");s.className="muted";s.textContent="찾은 사람이 없어요";box.appendChild(s)}
  },250);
}

// ===== 이벤트 =====
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-open],[data-new]");if(!t)return;
  if(t.dataset.new){openSheet(t.dataset.new);return}
  if(t.dataset.newkind){openSheet("approvals",null,t.dataset.newkind);return}
  if(t.dataset.open){openSheet(t.dataset.open,t.dataset.id);return}
  if(t.dataset.filter!==undefined){filter[route()]=t.dataset.filter;render();return}
  if(!sheet)return;
  if(t.id==="closeSheet"||t.id==="cancelSheet"){sheet=null;drawSheet();return}
  if(t.id==="saveSheet"){saveSheet();return}
  if(t.dataset.decide){decide(t.dataset.decide);return}
  if(t.id==="delAsk"){const c=collect();Object.assign(sheet.data,c.out);Object.assign(sheet.hr,c.hr);sheet.confirmDel=true;drawSheet();return}
  if(t.id==="delNo"){sheet.confirmDel=false;drawSheet();return}
  if(t.id==="delYes"){const {col,id,data}=sheet;try{await remove(col,id);if(col==="staff"&&me.admin&&S.hr.some(x=>x.id===id))await remove("hr",id);logAct(col,"삭제",data.title||data.name||data.code||data.site||"");toast("지웠어요");sheet=null;drawSheet()}catch(err){toast("지우지 못했어요")}return}
  if(t.dataset.rmfile!==undefined){sheet.files.splice(+t.dataset.rmfile,1);drawFiles();return}
  if(t.dataset.addrow){const k=t.dataset.addrow;sheet.rows[k].push(k==="logs"?{d:todayStr()}:{});drawRows(k);return}
  if(t.dataset.rmrow){sheet.rows[t.dataset.rmrow].splice(+t.dataset.i,1);drawRows(t.dataset.rmrow);return}
  if(t.dataset.acct){sheet.data.uid=t.dataset.acct;names[t.dataset.acct]=t.dataset.acctname||names[t.dataset.acct]||"";const n=$("#acctNow");if(n)n.textContent="연결됨: "+(t.dataset.acctname||"선택한 계정")+" (저장을 눌러야 반영)";return}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="q"){query=el.value;render();return}
  if(el.dataset.row){sheet.rows[el.dataset.row][+el.dataset.i][el.dataset.c]=el.value;return}
  if(el.dataset.money){const n=num(el.value);el.value=el.value.trim()?n.toLocaleString("ko-KR"):""}
  if(el.id==="acct")acctSearch(el.value);
});
document.addEventListener("focusin",e=>{if(e.target.id==="acct"&&!e.target.value)acctSearch("")});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.step){const n=+el.dataset.step;sheet.steps=el.checked?[...new Set(sheet.steps.concat(n))]:sheet.steps.filter(x=>x!==n);return}
  if(el.dataset.row){sheet.rows[el.dataset.row][+el.dataset.i][el.dataset.c]=el.value;return}
  if(el.id==="fileIn"){uploadFiles([...el.files]);el.value="";return}
  if(sheet&&sheet.col==="approvals"&&el.dataset.k==="kind"){const c=collect();Object.assign(sheet.data,c.out);drawSheet()}
});
document.addEventListener("submit",e=>e.preventDefault());
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet){sheet=null;drawSheet()}});
window.addEventListener("hashchange",()=>{query="";render();window.scrollTo(0,0)});

// ===== 시작 =====
loadLocal();me.admin=true;me.isOwner=true;render();
(async()=>{
  if(!window.claude||!window.claude.use)return;
  try{user=await window.claude.use("user")}catch(e){user=null}
  try{db=await window.claude.use("db")}catch(e){db=null}
  if(!db){render();return}
  mode="shared";me.admin=false;me.isOwner=false;
  if(user){try{const v=await user.me();me={id:v.id,name:v.name,isOwner:v.isOwner,admin:v.isOwner||v.canEdit,avatar:v.avatarUrl};if(v.id&&v.name)names[v.id]=v.name}catch(e){}
    const w=$("#who");if(w&&me.id){w.innerHTML="";const img=document.createElement("img");img.src=me.avatar;img.alt="";const s=document.createElement("span");s.textContent=(me.name||"나")+(me.isOwner?" · 대표":"");w.append(img,s)}}
  try{assets=await window.claude.use("assets")}catch(e){assets=null}
  Object.keys(S).forEach(k=>{S[k]=[]});
  const cols=["notices","staff"].concat(NAV_ORDER.filter(k=>k!=="staff"));
  if(me.admin)cols.push("hr");
  cols.forEach(col=>{db.collection(col).onSnapshot(snap=>{S[col]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));render();resolveNames()},()=>{})});
  db.collection("activity").orderBy("at","desc").limit(40).onSnapshot(snap=>{S.activity=snap.docs.map(d=>Object.assign({id:d.id},d.data()));render();resolveNames()},()=>{});
  render();
})();
})();
</script>
