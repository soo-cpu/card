<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>홈퍼니싱 인트라넷</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: deep-navy side rail (top scroll row on phones) + white work area; each menu = summary chips, filter, list, detail sheet */
:root{
  --navy:#1F4E79; --deep:#203864; --yellow:#FFC000;
  --bg:#ffffff; --panel:#ffffff; --soft:#F2F2F2; --ink:#111418; --sub:#5f6670; --line:#dde3ea;
  --accent:#1F4E79; --accent-ink:#ffffff; --tint:#D1E3F3; --rail:#203864; --rail-ink:#e6edf6; --th:#1F4E79; --th-ink:#ffffff;
  --ok:#1f7a4d; --ok-bg:#e3f3ea; --warn:#8a5a00; --warn-bg:#fff4d6; --bad:#c62828; --bad-bg:#fde8e8;
  --font:"Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1521; --panel:#152033; --soft:#1a2740; --ink:#e8eef6; --sub:#9aa8ba; --line:#2a3a55;
  --accent:#7fb2e5; --accent-ink:#0e1521; --tint:#1d3556; --rail:#0a1220; --rail-ink:#d7e2f0; --th:#1d3556; --th-ink:#e8eef6;
  --ok:#6fd3a0; --ok-bg:#163527; --warn:#ffcf5c; --warn-bg:#3a2f12; --bad:#ff8a8a; --bad-bg:#3d1c1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1521; --panel:#152033; --soft:#1a2740; --ink:#e8eef6; --sub:#9aa8ba; --line:#2a3a55;
  --accent:#7fb2e5; --accent-ink:#0e1521; --tint:#1d3556; --rail:#0a1220; --rail-ink:#d7e2f0; --th:#1d3556; --th-ink:#e8eef6;
  --ok:#6fd3a0; --ok-bg:#163527; --warn:#ffcf5c; --warn-bg:#3a2f12; --bad:#ff8a8a; --bad-bg:#3d1c1c; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding-left:max(14px,env(safe-area-inset-left,0px));overflow-y:auto}
.logo{display:flex;gap:10px;align-items:center}
.logo .mark{width:34px;height:34px;border-radius:8px;background:var(--rail-ink);color:var(--deep);display:grid;place-items:center;font-weight:900;font-size:15px}
.logo b{display:block;font-size:15px;font-weight:900;letter-spacing:.02em}
.logo small{display:block;font-size:11px;opacity:.7;letter-spacing:.12em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:11px;letter-spacing:.12em;opacity:.55;padding:10px 12px 2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;color:inherit;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:500;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.07);opacity:1}
.nav a[aria-current="page"]{background:rgba(255,255,255,.12);opacity:1;font-weight:700;box-shadow:inset 3px 0 0 var(--yellow)}
.nav .cnt{font-size:12px;min-width:22px;text-align:center;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.14);font-variant-numeric:tabular-nums}
.who{margin-top:auto;font-size:12px;opacity:.8;display:flex;gap:8px;align-items:center}
.who img{width:24px;height:24px;border-radius:50%}
.main{min-width:0;padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:18px}
.banner{border:1px solid var(--line);background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{margin:0;font-size:24px;font-weight:900;text-wrap:balance}
.head p{margin:2px 0 0;color:var(--sub);font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel);text-decoration:none;color:inherit;display:grid;gap:2px}
.tile span{font-size:13px;color:var(--sub)}
.tile strong{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--accent)}
.tile small{font-size:12px;color:var(--sub)}
.tile.alert{border-color:var(--yellow);box-shadow:inset 0 3px 0 var(--yellow)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px 18px;min-width:0}
.card h2{margin:0 0 10px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.list{display:grid}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.item .t{min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--sub);font-size:12px}
.muted{color:var(--sub);font-size:13px}
.empty{padding:22px 10px;text-align:center;color:var(--sub);font-size:14px;border:1px dashed var(--line);border-radius:10px}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--sub);border:1px solid var(--line)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.info{background:var(--tint);color:var(--accent);border-color:transparent}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--th);color:var(--th-ink);text-align:left;font-weight:600;padding:9px 12px;white-space:nowrap;font-size:13px}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--soft)}
tbody tr[data-open]{cursor:pointer}
tbody tr[data-open]:hover td{background:var(--tint)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)}
.toollinks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.toollink{border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:inherit;display:grid;gap:2px;background:var(--soft)}
.toollink b{color:var(--accent)}
.toollink small{color:var(--sub);font-size:12px}
.forms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.forms section{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel);min-width:0}
.forms h3{margin:0 0 8px;font-size:14px;color:var(--accent)}
.forms ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.forms a{color:var(--ink);text-decoration:none;font-size:14px}
.forms a:hover{color:var(--accent);text-decoration:underline}
.forms .use{font-size:11px;color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;cursor:pointer;background:var(--panel)}
details.plan summary{cursor:pointer;font-weight:700}
.sum3{display:grid;gap:6px;margin:10px 0;padding:0;list-style:none}
.sum3 li{padding:8px 12px;border-radius:8px;background:var(--soft)}
.foot{color:var(--sub);font-size:12px;text-align:center;padding-top:10px;letter-spacing:.04em}
.veil{position:fixed;inset:0;background:rgba(10,18,32,.45);display:grid;place-items:center;z-index:20;padding:16px}
.sheet{background:var(--panel);color:var(--ink);border-radius:14px;width:min(820px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:grid;gap:14px;border:1px solid var(--line)}
.sheet h3{margin:0;font-size:18px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.navbar{position:sticky;top:-20px;z-index:6;margin:-20px -20px 0;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;min-width:0}
.navbar>.btn{flex:0 0 auto;min-height:36px;font-weight:700}
.crumb{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;min-width:0;font-size:13px;color:#555}.crumb i{font-style:normal;color:#999}.crumb b{color:#1F4E79;overflow-wrap:anywhere}.crumb span{overflow-wrap:anywhere}
.crumb button{border:0;background:transparent;font:inherit;color:#1F4E79;text-decoration:underline;cursor:pointer;padding:4px 0;min-height:28px;overflow-wrap:anywhere;text-align:left}
#navRetBar{position:sticky;top:0;z-index:5;padding:8px 12px;background:#D1E3F3;border-bottom:1px solid #1F4E79;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#navRetBar:empty{display:none}
.sheet h4{margin:6px 0 0;font-size:14px;color:var(--accent);grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.f{display:grid;gap:4px;min-width:0;align-content:start}
.f.wide{grid-column:1/-1}
.f label{font-size:12px;color:var(--sub);font-weight:600}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.f textarea{min-height:90px;resize:vertical}
.hint{font-size:12px;color:var(--sub);font-weight:400}
.secnote{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 10px}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}
.steps .grp{grid-column:1/-1;font-weight:700;font-size:13px;color:var(--accent);margin-top:6px}
.steps label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:400}
.rows{display:grid;gap:6px}
.row{display:grid;gap:6px;align-items:center}
.row input,.row select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
.files{display:flex;flex-wrap:wrap;gap:8px}
.file{border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;gap:8px;align-items:center;font-size:13px;max-width:100%}
.file img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.file a{color:var(--accent);word-break:break-all}
.fdrop{border:2px dashed var(--line);border-radius:10px;padding:16px 10px;color:var(--sub);text-align:center;margin-top:6px;font-size:13px;line-height:1.6;outline:none;caret-color:transparent;min-height:64px}
.fdrop:focus{border-color:var(--accent)}.fdrop.on{border-color:var(--accent);background:var(--tint);color:var(--ink)}
.file .fnm{min-width:0;word-break:break-all}.file .fic{width:44px;height:44px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--accent);flex:0 0 auto}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.actions .r{display:flex;gap:8px;flex-wrap:wrap}
.flow{display:flex;flex-wrap:wrap;gap:4px;font-size:12px;align-items:center}
.flow span{padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--sub)}
.flow span.on{background:var(--accent);color:var(--accent-ink)}
.flow span.done{background:var(--ok-bg);color:var(--ok)}
.flow span.no{background:var(--bad-bg);color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--deep);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;height:auto;flex-direction:row;align-items:center;gap:10px;padding-block:10px;z-index:5;overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .logo small,.logo b,.nav .grp{display:none}
  .nav{flex-direction:row;overflow-x:auto;flex:1;min-width:0}
  .nav a{white-space:nowrap;padding:7px 10px}
  .nav a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--yellow)}
  .who{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.toollinks,.forms{grid-template-columns:1fr}
}
/* 휴대폰 화면 (2026-11-12): 중요한 메뉴·열만 · '전체 보기' = PC 화면 · 두 손가락 확대·축소 */
#pvTop{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:70;background:#C55A11;color:#fff;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center;padding:8px 12px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.25);text-align:center}
#pvTop b{font-size:15px}#pvTop small{opacity:.9}#pvTop .btn{background:#fff;color:#8a3d08;border-color:#fff;font-weight:700}
body.pvmode{padding-top:52px}@media (max-width:860px){body.pvmode{padding-top:88px}}@media print{#pvTop{display:none}}
/* 문자 발송 (v0.99-23) */
.smssheet{width:min(640px,100%)}.smssheet textarea,.smssheet select,#smsCfg textarea{width:100%;font-size:16px;box-sizing:border-box}
.smsmode{font-size:18px;font-weight:700;padding:12px;border-radius:10px;text-align:center}.smsmode.t{background:#D1E3F3;color:#1F4E79}.smsmode.r{background:#c62828;color:#fff}
.smslist{max-height:112px;overflow:auto;display:flex;flex-wrap:wrap;gap:4px}.smslist.col{display:grid}
.smssum{font-size:16px}.smswarn{padding:8px 10px;border-radius:8px;background:#FFF4D6;color:#5b4300;font-size:14px}.smswarn.bad{background:#fde7e7;color:#a11111;font-weight:600}
.smsprev{display:grid;gap:8px;max-height:44vh;overflow:auto}.smsitem{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.smsitem pre,.smslog pre{white-space:pre-wrap;word-break:break-word;margin:6px 0 0;font:inherit}
.smschk{display:flex;align-items:center;gap:8px;font-size:15px!important;color:var(--ink)!important;font-weight:600}.smschk input{width:20px;height:20px}
.smslog{border-top:1px solid var(--line);padding:6px 0}.smslog summary{cursor:pointer}
.mtools{display:none}
@media (max-width:860px){
  .mtools{display:flex;gap:4px;flex:0 0 auto}
  .mtb{border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--rail-ink);border-radius:8px;padding:5px 8px;font-size:12px;white-space:nowrap;cursor:pointer}
  .mtb[aria-pressed="true"],.mtb[aria-expanded="true"]{background:var(--yellow);color:#203864;border-color:var(--yellow)}
  .rail{flex-wrap:wrap}
  body:not(.navall):not(.pcview) .nav>a:not([href="#home"]):not([href="#calendar"]):not([href="#goal"]):not([href="#projects"]):not([href="#approvals"]):not([href="#quotes"]):not([href="#sites"]):not([href="#reports"]):not([aria-current="page"]){display:none}
  body.navall:not(.pcview) .nav{flex-wrap:wrap;overflow:visible}
  body.navall:not(.pcview) .rail{overflow:visible}
  body:not(.pcview) .tablebox .mh{display:none}
  body.pcview .app{grid-template-columns:232px 1fr;width:1100px}
  body.pcview .rail{position:static;height:auto;min-height:100%;flex-direction:column;align-items:stretch;flex-wrap:nowrap;padding:20px 14px;overflow-y:auto}
  body.pcview .logo small,body.pcview .logo b,body.pcview .nav .grp{display:block}
  body.pcview .nav{flex-direction:column;overflow:visible;flex:0 0 auto}
  body.pcview .nav a{white-space:normal}
  body.pcview .mtools{flex-direction:column}
  body.pcview .main{padding-left:24px;padding-right:24px}
  body.pcview .tiles{grid-template-columns:repeat(5,minmax(0,1fr))}
  body.pcview .grid2{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
  body.pcview .toollinks{grid-template-columns:repeat(2,minmax(0,1fr))}
  body.pcview .forms{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:520px){
  body.pcview .form{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form,.steps{grid-template-columns:1fr}
  .row{grid-template-columns:1fr 1fr!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* 상담 진행 모드: 매장 TV로 고객과 함께 보는 화면. 원가·마진 없음, 큰 글씨 */
body.consulting .rail{display:none}
body.consulting .app{grid-template-columns:1fr}
.cs{display:grid;gap:18px;max-width:1280px;margin:0 auto}
.cs-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.cs-top h1{margin:0;font-size:clamp(22px,3vw,34px);font-weight:900;letter-spacing:-.01em}
.cs-top small{display:block;color:var(--sub);font-size:clamp(13px,1.4vw,17px);font-weight:500}
.cs-steps{display:flex;flex-wrap:wrap;gap:6px}
.cs-steps button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:clamp(13px,1.3vw,16px);cursor:pointer}
.cs-steps button.done{background:var(--tint)}
.cs-steps button[aria-current="step"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.cs-space{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:3px solid var(--navy);padding-bottom:8px}
.cs-space h2{margin:0;font-size:clamp(28px,4vw,48px);font-weight:900}
.cs-space .sub{font-size:clamp(16px,1.8vw,22px);color:var(--sub)}
.cs-space .sub b{color:var(--ink);font-size:1.25em}
.cs-group{display:grid;gap:8px}
.cs-group h3{margin:0;font-size:clamp(15px,1.5vw,19px);color:var(--sub);font-weight:700}
.cs-cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}

async function workSync(){if(PV||!me.admin||mode!=="shared"||!db||!S.staff.length)return;/* 직원 명단을 읽기 전에는 맞추지 않음: 직원이 쓴 줄을 '모르는 사람 것'으로 보고 덮거나 빼던 길 */const G=await goneSet();let up=0,down=0,gone=0;

  if(wgoneReady&&WORK_COLS.every(c=>S[c].length)){const want={};G.forEach(k=>{const i=k.indexOf("__"),col=k.slice(0,i),id=k.slice(i+2);if(WORK_COLS.includes(col)&&id&&!S[col].some(r=>r.id===id))want[k]={col,id}});
    for(const k of Object.keys(want)){if(WGONE[k])continue;const o=Object.assign({by:me.id,byName:myName(),at:nowISO()},want[k]);if(GONE_NO[k])o.no=GONE_NO[k];try{await db.collection(GONEP).doc(k).set(o);WGONE[k]=o;gone++}catch(e){}}
    // 표시를 지우는 것은: 원본에 다시 있을 때(되살림) / 휴지통·지운 목록에 없고 만든 지 3분(대표가 만든 것은 15분) 지난 것만. 지우기 직전에 휴지통을 다시 읽음

      const back=WORK_COLS.includes(col)&&S[col].some(r=>r.id===id); // 원본에 살아 있음 (되살림 · 같은 번호로 새로 등록)

    // 1) 직원이 공용 칸에서 고친 것·새로 만든 것 → 원본 (명단에 있는 직원 + 고칠 수 있는 건만)
    for(const [id,x] of Object.entries(W)){if(!x.__by||x.__by==="admin")continue;const c=S[col].find(r=>r.id===id);

      const o=Object.assign({},x);delete o.__by;delete o.__base;delete o.id;if(col==="customers"&&c&&(c.smsLog||o.smsLog))o.smsLog=smsMerge(c.smsLog,o.smsLog);
      if(c){const nf=keepFiles(o,c,x);if(nf)o.__at=nowISO();/* 낡은 화면 저장: 원본에만 있던 첨부를 다시 붙이고, 그 줄이 직원 사본·공용 칸으로 다시 내려가게 시각을 올림 */}
      if(c){const cc=clean(c);WORK_DROP.forEach(k=>{if(cc[k]!==undefined)o[k]=cc[k]});if(amtLocked(c)&&!isAcct(s))AMT_KEYS.forEach(k=>{if(c[k]!==undefined)o[k]=c[k]});if(c.amtLock)o.amtLock=c.amtLock}
      if(col==="customers"){const p=PRIVC[id]||{};if((x.tel||x.addr)&&((x.tel||p.tel||"")!==(p.tel||"")||(x.addr||p.addr||"")!==(p.addr||"")))await db.collection("cpriv").doc(id).set({tel:x.tel||p.tel||"",addr:x.addr||p.addr||"",updatedAt:x.__at});o.tel="";o.addr=""}
      // 옛 값 기록 (지우지 않음)
      const prev={};if(c){const cc=clean(c);Object.keys(Object.assign({},cc,o)).forEach(k=>{if(k.startsWith("__"))return;if(stableJs(cc[k])!==stableJs(o[k]))prev[k]=cc[k]===undefined?null:cc[k]})}
      try{await db.collection("acct/_work/log").doc(col+"__"+id+"__"+Date.now()).set({col,id,by:x.__by,byName:s.name||"",at:x.__at,applied:nowISO(),isNew:!c,prev:JSON.stringify(prev).slice(0,60000),title:String(o.title||o.name||o.site||o.no||o.qno||"").slice(0,80)})}catch(e){}
      await db.collection(col).doc(id).set(o);took.add(id);up++}

function ordMdParse(txt){const out=[];String(txt||"").split(/\r?\n/).forEach(l=>{const t=l.trim();if(!/^[-*]\s/.test(t))return;const p=t.replace(/^[-*]\s+/,"").split("|").map(x=>x.trim());if(p.length<2||!p[0]||!p[1])return;if(/^받는 ?사람$/.test(p[0]))return;

// ===== 캐시플로우 월별 보기 (대표 지시 2026-11-13 6번 · v0.99-29) =====
// 수입·지출 = 자금일보(사본 cfhist + 매일 자동 반영 cfnew / 직원 사본 hist·histNew)의 날짜별 입금·출금을 달마다 그대로 더한 값. 마진 = 수입 − 지출.
// 고정비 = 그 달 출금 줄(지급 예정 제외) 중 ‘고정비 구분 기준’(대표가 고른 항목·거래처 — fin/cfset.fixedCats·fixedWho, 처음에는 항목 ‘고정비’만)에 드는 줄의 합. 추정하지 않음 — 줄이 없는 달은 ‘—’.
const cfWho=s=>String(s||"").replace(/[\[\]\s]/g,"");
const cfFixSet=()=>{const st=finData().set||{};return {cats:Array.isArray(st.fixedCats)?st.fixedCats:["고정비"],who:Array.isArray(st.fixedWho)?st.fixedWho:[]}};
const cfIsFix=(e,fx)=>(!!e.cat&&fx.cats.includes(e.cat))||(!!cfWho(e.who)&&fx.who.includes(cfWho(e.who)));
function cfMonths(){const S2=cfSeries(),F=finData(),fx=cfFixSet(),M={};const g=k=>M[k]||(M[k]={m:k,in:0,out:0,days:[],n:0,ncat:0,fix:0,nfix:0});
  S2.forEach(r=>{const o=g(r.d.slice(0,7));o.in+=r.in;o.out+=r.out;o.days.push(r)});
  F.cf.forEach(e=>{if(!e.d||e.plan||e.io!=="출금")return;const k=String(e.d).slice(0,7);if(!M[k])return;const o=M[k];o.n++;if(e.cat)o.ncat++;if(cfIsFix(e,fx)){o.fix+=num(e.amt);o.nfix++}});
  return Object.values(M).sort((a,b)=>b.m.localeCompare(a.m))}
function cfMonthHTML(){const A=cfMonths(),n=v=>Math.round(num(v)).toLocaleString("ko-KR"),fx=cfFixSet(),years=[...new Set(A.map(x=>x.m.slice(0,4)))];
  if(!A.length)return `<section class="card" id="cfMonth"><h2>월별 보기</h2><div class="empty">자금일보 자료가 아직 없어요</div></section>`;
  const L=cfYear==="12"?A.slice(0,12):A.filter(x=>x.m.slice(0,4)===cfYear),mx=Math.max(1,...L.map(x=>Math.abs(x.in-x.out))),T=L.reduce((t,x)=>({in:t.in+x.in,out:t.out+x.out,fix:t.fix+x.fix,n:t.n+x.n}),{in:0,out:0,fix:0,n:0});

  const bar=v=>{const w=Math.max(v?2:0,Math.round(Math.abs(v)/mx*100));return `<div class="cfm-bar" title="${v<0?"마이너스 ":"플러스 "}${n(Math.abs(v))}원" aria-hidden="true"><i style="width:${w}%;background:${v<0?"#C62828":"#1F4E79"}"></i></div>`};

  const F=finData(),cats=[...new Set(CF_CATS.concat(F.cf.map(e=>e.cat).filter(Boolean)))],wc={};F.cf.forEach(e=>{if(e.plan||e.io!=="출금")return;const w=cfWho(e.who);if(!w||/->|→/.test(w)||/급여|상여|차입|가수금|가지급/.test(w+" "+(e.memo||"")))return;wc[w]=(wc[w]||0)+1});
  const whos=Object.keys(wc).sort((a,b)=>wc[b]-wc[a]||a.localeCompare(b)).slice(0,80),noCat=A.reduce((t,x)=>t+x.n-x.ncat,0),allN=A.reduce((t,x)=>t+x.n,0);
  return `<section class="card" id="cfMonth"><h2><span>월별 보기</span><small class="muted">수입 · 지출 · 고정비 · 마진(수입−지출)${cfCopyNote()}</small></h2>

// 저장: 인트라넷 영구 DB cal/{id} (브라우저 저장 아님) · 모두 읽기·등록, 수정·삭제는 등록한 본인과 대표(최윤수·신혜현)만 (화면에서 막음)
const CAL_KINDS=[["연차","#C62828"],["반차","#EF6C00"],["휴가","#AD1457"],["외근·현장","#1565C0"],["오늘 계획","#2E7D32"],["공정표","#6A1B9A"],["기타","#546E7A"]];
const CAL_COLOR=Object.fromEntries(CAL_KINDS);
const CAL_AUTO=["연차","반차","휴가"];
let CAL={},calSubs={},calView="month",calDay="",calWho="",calKind="";
const calBoss=()=>!!me.admin||myName()==="최윤수";
const calIni=n=>{n=String(n||"").trim();return n.length>=3?n.slice(1,3):n.slice(0,2)};
const calDs=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};
const calAdd=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return calDs(d)};
function calInit(){if(!db||mode!=="shared"||calSubs.all)return;try{calSubs.all=db.collection("cal").onSnapshot(s=>{CAL.all=s.docs.map(x=>Object.assign({},x.data(),{id:x.id,__u:"all"}));if(route()==="calendar")render();try{calMiniDraw()}catch(x){}},()=>{CAL.all=CAL.all||[]})}catch(e){calSubs.all=1}}
function calAll(){let L=[].concat(...Object.values(CAL));if(calWho)L=L.filter(e=>e.name===calWho);if(calKind)L=L.filter(e=>e.kind===calKind);return L}
// 연차·반차는 토·일요일에는 캘린더에 안 보임 (직원 요청 2026-11-11 채진아 · 화면만, 연차 차감 계산은 그대로)
const calWkend=ds=>{const d=new Date(String(ds).slice(0,10)+"T00:00:00Z").getUTCDay();return d===0||d===6};
const calOn=(e,ds)=>String(e.start||"")<=ds&&ds<=String(e.end||e.start||"")&&!(["연차","반차"].includes(e.kind)&&calWkend(ds));
const calTitle=e=>e.lvAp?(e.title||""):CAL_AUTO.includes(e.kind)?(e.name||"")+" "+e.kind:(e.title||e.kind||"일정");
// 공정표 일정은 현장별 색 + '현장명 · 공정', 여러 날 일정(휴가 등)은 기간 표시 (2026-11-05)
const GJ_PAL=["#6A1B9A","#00838F","#AD1457","#2E7D32","#E65100","#283593","#5D4037","#00695C","#C62828","#1565C0","#827717","#4E342E"];
const gjColor=k=>{let h=0;String(k||"").split("").forEach(ch=>{h=(h*31+ch.charCodeAt(0))>>>0});return GJ_PAL[h%GJ_PAL.length]};
function calChip(e){const gj=e.kind==="공정표"&&e.gjPid;const c=gj?gjColor(e.gjPid):(CAL_COLOR[e.kind]||"#546E7A");const per=e.end&&e.end!==e.start?` <small>(${esc(String(e.start).slice(5))}~${esc(String(e.end).slice(5))})</small>`:"";
  return `<button type="button" class="calchip" data-calopen="${esc(e.__u)}|${esc(e.id)}" title="${esc(gj?(e.gjSite||e.site||"")+" · "+(e.title||""):calTitle(e))}" style="border-left:4px solid ${c}${gj?";background:"+c+"1A":""}">${gj?`<span class="calini" style="background:${c}">${esc(String(e.gjSite||e.site||"현장").slice(0,8))}</span>${esc(e.title||"")}`:`<span class="calini" style="background:${c}">${esc(e.ini||calIni(e.name))}</span>${e.allDay===false&&e.time?esc(e.time)+" ":""}${esc(calTitle(e))}${e.site?` <small>· ${esc(e.site)}</small>`:""}`}${per}</button>`}
function renderCal(){calInit();const today=todayStr();if(!calDay)calDay=today;const L=calAll();
  const names=Array.from(new Set((S.staff||[]).filter(s=>s.state!=="퇴사").map(s=>s.name).concat(Object.values(CAL).flat().map(e=>e.name)).filter(Boolean)));
  const head=`<div class="head"><div><h1>공용 캘린더</h1><p>연차·휴가·외근·오늘 계획을 모두 같이 봐요 · 등록은 누구나, 수정·삭제는 등록한 본인과 대표만</p></div><div class="tools"><button class="btn pri" type="button" data-calnew="">+ 일정 등록</button></div></div>
  <div class="tools"><div class="chips">${[["month","월간"],["week","주간"],["today","오늘"]].map(([v,t])=>`<button class="chip" type="button" data-calview="${v}" aria-pressed="${calView===v}">${t}</button>`).join("")}</div>
  <button class="btn sm" type="button" data-calmove="-1">◀</button><button class="btn sm" type="button" data-calmove="0">오늘</button><button class="btn sm" type="button" data-calmove="1">▶</button>
  <select class="btn" id="calWho" aria-label="직원으로 보기"><option value="">직원 전체</option>${names.map(n=>`<option ${n===calWho?"selected":""}>${esc(n)}</option>`).join("")}</select>
  <select class="btn" id="calKind" aria-label="종류로 보기"><option value="">종류 전체</option>${CAL_KINDS.map(([k])=>`<option ${k===calKind?"selected":""}>${k}</option>`).join("")}</select></div>
  <div class="chips calleg">${CAL_KINDS.map(([k,c])=>`<span class="pill" style="border-left:4px solid ${c}">${k}</span>`).join("")}</div>${(()=>{const S1={};L.filter(e=>e.gjPid).forEach(e=>{S1[e.gjPid]=e.gjSite||e.site||"현장"});const k=Object.keys(S1);return k.length?`<div class="chips calleg">${k.map(id=>`<span class="pill" style="border-left:6px solid ${gjColor(id)}">${esc(S1[id])}</span>`).join("")}<span class="hint">현장별 공정 색</span></div>`:""})()}`;
  let body="";
  if(calView==="today"){const ds=calDay,ev=L.filter(e=>calOn(e,ds));const off=ev.filter(e=>["연차","반차","휴가"].includes(e.kind));const plan=ev.filter(e=>!["연차","반차","휴가"].includes(e.kind));
    const by={};plan.forEach(e=>{(by[e.name||"?"]=by[e.name||"?"]||[]).push(e)});
    body=`<h2 style="margin:6px 0">${esc(ds)}${ds===today?" (오늘)":""}</h2><div class="grid2"><section class="card"><h2>연차·휴가 ${off.length}명</h2>${off.length?off.map(calChip).join(""):'<p class="muted">없어요</p>'}</section>
    <section class="card"><h2>직원별 오늘 계획·일정</h2>${Object.keys(by).length?Object.entries(by).map(([n,a])=>`<div style="margin:6px 0"><b>${esc(n)}</b><div>${a.sort((x,y)=>String(x.time||"").localeCompare(String(y.time||""))).map(calChip).join("")}</div></div>`).join(""):'<p class="muted">등록된 계획이 없어요 · ‘+ 일정 등록’에서 ‘오늘 계획’을 골라 적어요</p>'}</section></div>`}
  else if(calView==="week"){const d0=new Date(calDay+"T00:00:00");const mon=calAdd(calDay,-((d0.getDay()+6)%7));const days=[0,1,2,3,4,5,6].map(i=>calAdd(mon,i));
    body=`<div class="calweek">${days.map(ds=>{const ev=L.filter(e=>calOn(e,ds));const wd="월화수목금토일"[days.indexOf(ds)];return `<section class="calwd${ds===today?" caltoday":""}"><h3><button type="button" class="callink" data-calday="${ds}">${wd} ${esc(ds.slice(5))}</button></h3>${ev.map(calChip).join("")||'<span class="hint">—</span>'}</section>`}).join("")}</div>`}
  else{const first=calDay.slice(0,8)+"01",fd=new Date(first+"T00:00:00");const start=calAdd(first,-((fd.getDay()+6)%7));const cells=[];for(let i=0;i<42;i++)cells.push(calAdd(start,i));
    body=`<h2 style="margin:6px 0">${esc(calDay.slice(0,4))}년 ${num(calDay.slice(5,7))}월</h2><div class="calgrid">${"월화수목금토일".split("").map(w=>`<div class="calhd">${w}</div>`).join("")}${cells.map(ds=>{const ev=L.filter(e=>calOn(e,ds));const out=ds.slice(0,7)!==calDay.slice(0,7);return `<div class="calcell${out?" calout":""}${ds===today?" caltoday":""}"><button type="button" class="callink" data-calday="${ds}">${num(ds.slice(8))}</button>${ev.slice(0,3).map(calChip).join("")}${ev.length>3?`<button type="button" class="callink" data-calday="${ds}">+${ev.length-3}</button>`:""}</div>`}).join("")}</div>`}
  return head+body+`<div class="foot">ⓒ HOME FURNISHING CO. all rights reserved.</div>`}
// 공정표 → 공용 캘린더 (2026-11-05 지시): 프로젝트에 올린 공정표(사진·PDF·엑셀)를 AI로 읽어 날짜별 공정을 cal에 '공정표'(gjPid=프로젝트)로 넣음
// 이어진 날의 같은 공정은 한 일정으로 · 다시 읽으면 그 현장 공정표 일정을 새 내용으로 바꿈(없어진 건 지움) · 이름에 '공정표'가 들어간 새 파일이 저장돼 있으면 프로젝트를 열 때 자동으로 다시 읽음
let gjBusy=false;const gjAuto={};
function gjFiles(d,id){const L=(d.files||[]).slice();if(sheet&&sheet.col==="projects"&&sheet.id===id)(sheet.files||[]).forEach(f=>{if(!L.some(x=>x.id===f.id))L.push(f)});return L.filter(f=>/^image\//.test(f.type||"")||/\.(pdf|xlsx|xlsm|xls|jpe?g|png|webp)$/i.test(f.name||"")||/pdf/.test(f.type||""))}
// 화면이 열려 있으면 항상: 파일 이름에 '공정표'가 든 새 첨부가 있는 프로젝트를 찾아 자동으로 읽음 (대표는 전부, 직원은 담당·내가 만든 프로젝트) · 캘린더가 다 불러와진 뒤에만
function gjScan(){if(!sampleCap||!db||gjBusy||!Array.isArray(CAL.all))return;for(const p of (S.projects||[])){const named=(p.files||[]).filter(f=>/공정표/.test(f.name||"")),nw=named[named.length-1];if(!nw||!p.id)continue;if(CAL.all.some(e=>e.gjPid===p.id&&e.gjFile===nw.id))continue;if(gjAuto[p.id+"|"+nw.id])continue;if(!(me.admin||mode!=="shared"||(myName()&&p.mgr===myName())||p.createdBy===me.id))continue;gjAuto[p.id+"|"+nw.id]=1;setTimeout(()=>{toast((p.title||p.no||"")+" 새 공정표를 캘린더에 넣는 중…");gjRead(p.id,nw.id)},800);break}}
function gjRedraw(){if(sheet&&sheet.col==="projects"){const c=collect();Object.assign(sheet.data,c.out);drawSheet()}}
function gjHTML(d,id){if(!id)return "";const fs=gjFiles(d,id),site=(d.title||d.no||"");const ev=(CAL.all||[]).filter(e=>e.gjPid===id).sort((a,b)=>String(a.start).localeCompare(String(b.start)));
  const named=(d.files||[]).filter(f=>/공정표/.test(f.name||"")),newest=named[named.length-1],lastF=ev.length?ev[0].gjFile:"";
  if(newest&&Array.isArray(CAL.all)&&!ev.some(e=>e.gjFile===newest.id)&&sampleCap&&!gjBusy&&!gjAuto[id+"|"+newest.id]&&db){gjAuto[id+"|"+newest.id]=1;setTimeout(()=>{toast("새 공정표가 있어 캘린더를 다시 읽어요");gjRead(id,newest.id)},400)}

function qvLabel(prev,data){if(!prev)return "새 견적";const a=JSON.stringify((prev.items||[]).map(l=>[l.name,num(l.q),num(l.price)])),b=JSON.stringify((data.items||[]).map(l=>[l.name,num(l.q),num(l.price)]));if(a!==b)return "품목·금액";if(num(prev.amount)!==num(data.amount))return "금액";const P=["prog","progHist","lostWhy","sentAt","sentVia","sentBy","sentHist","sent","updatedAt","updatedBy"],x=Object.assign({},qvBody(prev)),y=Object.assign({},qvBody(data));P.forEach(k=>{delete x[k];delete y[k]});return qvSig(x)===qvSig(y)?"진행 단계·발송 기록":"견적 정보"}
function qvMake(qid,n,data,label){const at=nowISO();return {vid:"v"+String(n).padStart(4,"0")+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),qid,n,at,by:me.id||"",byName:myName()||"",label,qno:data.qno||"",amount:num(data.amount),cnt:(data.items||[]).length,data:qvBody(data)}}
async function qvWrite(v,uidOverride){if(PV)return true;/* 미리 보기: 브라우저에도 서버에도 남기지 않음 */if(!(db&&mode==="shared"&&me.id)){qvLocalPut(v.qid,v);return true}
  qvLocalPut(v.qid,Object.assign({},v,{pending:1}));
  try{await db.collection(qvCol(uidOverride||me.id,v.qid)).doc(v.vid).set(Object.assign({},v,{pending:null}));qvLocalPut(v.qid,v);return true}catch(e){qvRetryLater();return false}}
async function qvBefore(id,data){const prev=(S.quotes||[]).find(x=>x.id===id);data=Object.assign({},data);
  if(prev&&qvSig(prev)===qvSig(data)){if(prev.sv)data.sv=prev.sv;if(prev.svAt)data.svAt=prev.svAt;return {data,n:0}}
  const G=qvGroup(id,data.pno);let n=Math.max(0,...(S.quotes||[]).filter(q=>G.includes(q.id)).map(q=>num(q.sv)));
  // v0.72 전에 저장된 견적: 덮어쓰기 전에 지금 내용을 v1(기존 저장본)으로 먼저 보관
  if(prev&&!num(prev.sv)&&((prev.items||[]).length||prev.qno)){n+=1;const b=qvMake(id,n,prev,"기존 저장본 (v0.73 이전)");b.at=String(prev.updatedAt||prev.createdAt||b.at);b.by=prev.updatedBy||prev.createdBy||"";b.byName="";await qvWrite(b)}
  n+=1;data.sv=n;data.svAt=nowISO();return {data,n,label:qvLabel(prev,data)}}

  if(!ok)saveNote(false,"견적은 저장됐지만 v"+qv.n+" 보관본을 서버에 못 올렸어요 · 이 브라우저에 남겨 두고 다시 올릴게요");
  if(sheet&&sheet.id===id)document.querySelectorAll(".qvBox").forEach(el=>{const o=el.open;el.outerHTML=qVerHTML(id);if(o)document.querySelectorAll(".qvBox").forEach(x=>x.open=true)})}
async function qvRetry(){qvRetryT=null;if(PV)return;if(!(db&&mode==="shared"&&me.id))return;let left=0;
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.startsWith("hf-qver-"))continue;const L=JSON.parse(localStorage.getItem(k)||"[]");
    for(const v of L.filter(x=>x.pending)){try{const c=Object.assign({},v);delete c.pending;await db.collection(qvCol(me.id,v.qid)).doc(v.vid).set(c);qvLocalPut(v.qid,c)}catch(e){left++}}}}catch(e){}
  if(left)qvRetryLater()}

  if(db&&mode==="shared"&&me.id){const U=new Set([me.id]);if(me.admin)(S.staff||[]).forEach(s=>{if(s.uid)U.add(s.uid)});
    for(const u of U)for(const g of G){try{(await once(qvCol(u,g))).forEach(v=>{if(v&&v.n)all[v.vid||v.id]=Object.assign({vid:v.id},v)})}catch(e){}}
    for(const u of U){try{(await once("acct/"+u+"/qhist")).filter(h=>h&&G.includes(h.qid)).forEach(h=>{all["h:"+h.id]=qhAsVer(h,"h:"+h.id)})}catch(e){}}}

function bonusCalc(simAmt){const st=finSet(),Y=String(st.year),bm=num(st.bm)/100,bep=(num(st.fixed)+num(st.hire))/(bm||1);
  const inc=[],exc=[];let col=0,asc=0;const qc=[0,0,0,0];
  S.projects.forEach(p=>{const got=recvRows(p).filter(x=>String(x.d||"").startsWith(Y));if(!got.length)return;const r=fcRow(p);const mg=r.final!==null?r.final:r.rate!==null?r.rate:pjMoney(p).margin;
    const amt=got.reduce((t,x)=>t+x.amt,0);const why=perfOf(p)!=="순수 인테리어"?perfOf(p):(mg!==null&&mg<num(st.floor))?"마진 "+mg+"% (하한 "+st.floor+"% 미만)":"";
    if(why){exc.push({p,amt,why});return}
    inc.push({p,amt,mg});col+=amt;got.forEach(x=>{const q=Math.min(3,Math.floor((+String(x.d).slice(5,7)-1)/3));qc[q]+=x.amt});
    apx().filter(a=>a.pno===p.no&&a.use==="A/S"&&a.status!=="반려"&&String(a.createdAt||"").startsWith(Y)).forEach(a=>asc+=num(a.amount));
    S.as.filter(x=>x.pno===p.no&&String(x.d||"").startsWith(Y)).forEach(x=>asc+=num(x.asCost))});
  const poolOf=c=>{const ex=c-bep;if(ex>0)return Math.max(0,Math.round((ex*bm-asc)*num(st.share)/100));if(st.midOn&&c>=bep*num(st.mid)/100)return Math.max(0,Math.round((c-bep*num(st.mid)/100)*bm*num(st.midRate)/100));return 0};
  let cum=0,paid=0;const qs=qc.map((v,i)=>{cum+=v;const pool=poolOf(cum),adv=Math.max(0,Math.round(pool*num(st.adv)/100)-paid);paid+=adv;return {q:i+1,cum,pool,adv}});
  return {st,bep,col,asc,inc,exc,pool:poolOf(col),excess:col-bep,qs,sim:simAmt?poolOf(simAmt):null,pct:bep?Math.round(col/bep*1000)/10:0}}
function bonusAlloc(b){const st=b.st,Y=+st.year,adj=(FIN.alloc||{}).adj||{};
  const ppl=S.staff.filter(s=>!isBoss(s)&&s.name).map(s=>{const j=s.joined?new Date(s.joined+"T00:00:00"):new Date(Y,0,1),l=s.left?new Date(s.left+"T00:00:00"):new Date(Y,11,31);const a=Math.max(new Date(Y,0,1),j),z=Math.min(new Date(Y,11,31),l);const m=z>=a?Math.min(12,Math.round((z-a)/(30.4*864e5))+(z>=a?1:0)):0;return {s,m:Math.min(12,m),w:0}}).filter(x=>x.m>0);
  b.inc.forEach(({p,amt})=>{const prof=amt*num(st.bm)/100;const roles=[];const nm=new Set();
    const sales=p.mgr||((S.customers.find(c=>c.code===p.custCode)||{}).mgr)||((S.quotes.find(q=>q.pno===p.no&&q.staff)||{}).staff);if(sales)roles.push([sales]);
    const site=(S.sites.find(s=>s.pno===p.no&&s.mgr)||{}).mgr;if(site)roles.push([site]);
    const des=[...new Set(S.reports.filter(r=>(r.design||[]).some(x=>String(x.pno||"").trim()===p.no)).map(r=>r.who).filter(Boolean))];if(des.length)roles.push(des);
    roles.forEach(names=>names.forEach(n=>{const x=ppl.find(y=>y.s.name===n);if(x)x.w+=prof/roles.length/names.length}))});
  const eq=b.pool*num(st.eqPct)/100,co=b.pool-eq,M=ppl.reduce((t,x)=>t+x.m,0),W=ppl.reduce((t,x)=>t+x.w,0);
  return ppl.map(x=>{const e=M?Math.round(eq*x.m/M):0,c=W?Math.round(co*x.w/W):0,auto=e+c;const a=adj[x.s.name];return {name:x.s.name,m:x.m,e,c,auto,fin:a!==undefined&&a!==""?num(a):auto}})}

  v.innerHTML=`<div class="sheet" role="dialog" aria-label="미리 보기" style="width:min(1000px,100%)"><h3><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(name||"미리 보기")}</span><span style="display:flex;gap:6px"><a class="btn sm" href="${DRIVE(id)}" target="_blank" rel="noopener">새 창</a><button class="btn sm" type="button" data-dpclose="1">닫기</button></span></h3><p class="hint" style="margin:0">보기만 돼요 (인트라넷에서 고치거나 지울 수 없어요). 안 보이면 ‘새 창’을 누르세요 — 드라이브 권한이 있는 사람만 열려요.</p><iframe title="${esc(name||"")}" src="https://drive.google.com/file/d/${encodeURIComponent(id)}/preview" style="width:100%;height:75vh;border:1px solid var(--line);border-radius:8px;background:#fff" allow="autoplay"></iframe></div>`;document.body.appendChild(v)}
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("[data-dpclose],[data-dpv]");if(!t)return;e.preventDefault();if(t.dataset.dpclose){const v=document.getElementById("dpVeil");if(v)v.remove();return}
  const id=t.dataset.dpv;FMCNT[id]=(FMCNT[id]||0)+1;try{localStorage.setItem("hf_fmcnt",JSON.stringify(FMCNT))}catch(er){}drvPreview(id,t.dataset.dpn||t.textContent.trim())});
function fmItems(){return FORM_LIB.flatMap(([g,list])=>list.filter(([n])=>canSeeName(n)).map(([n,id,kind])=>({g,n,id,kind})))}
function fmRow(x){const pin=FMPIN.includes(x.id);return `<li style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px 0;border-top:1px dashed var(--line)"><button type="button" class="btn sm" data-fmpin="${esc(x.id)}" aria-pressed="${pin}" title="${pin?"고정 풀기":"맨 위 고정"}" aria-label="${pin?"고정 풀기":"맨 위 고정"}">${pin?"★":"☆"}</button><a href="${DRIVE(x.id)}" data-dpv="${esc(x.id)}" data-dpn="${esc(x.n)}" style="flex:1;min-width:0">${esc(x.n)}</a><small class="muted">${esc(x.g)}</small>${x.kind?`<button class="use" data-newkind="${esc(x.kind)}">결재로</button>`:""}</li>`}
function fmBodyHTML(){const A=fmItems(),q=FMQ.trim().toLowerCase();
  if(q){const L=A.filter(x=>(x.n+" "+x.g).toLowerCase().includes(q));return `<section class="card"><h2>‘${esc(FMQ)}’ 찾은 자료 ${L.length}건</h2>${L.length?`<ul style="list-style:none;margin:0;padding:0">${L.map(fmRow).join("")}</ul>`:'<div class="empty">맞는 자료가 없어요</div>'}</section>`}
  const pins=A.filter(x=>FMPIN.includes(x.id)),freq=A.filter(x=>!FMPIN.includes(x.id)&&FMCNT[x.id]).sort((a,b)=>FMCNT[b.id]-FMCNT[a.id]).slice(0,5);
  const groups=FORM_LIB.map(([g])=>[g,A.filter(x=>x.g===g)]).filter(([g,L])=>L.length);
  return `${pins.length||freq.length?`<section class="card"><h2>자주 쓰는 자료 <small class="muted">☆를 누르면 맨 위에 고정돼요</small></h2><ul style="list-style:none;margin:0;padding:0">${pins.concat(freq).map(fmRow).join("")}</ul></section>`:""}
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px">${groups.map(([g,L])=>`<button type="button" class="tile${FMOPEN===g?" alert":""}" data-fmopen="${esc(g)}" aria-expanded="${FMOPEN===g}" style="text-align:left;cursor:pointer"><span>${esc(g)}</span><strong>${L.length}</strong><small>${FMOPEN===g?"접기":"누르면 목록이 펼쳐져요"}</small></button>`).join("")}</div>
  ${FMOPEN?`<section class="card"><h2>${esc(FMOPEN)} <button type="button" class="btn sm" data-fmopen="${esc(FMOPEN)}">접기</button></h2><ul style="list-style:none;margin:0;padding:0">${A.filter(x=>x.g===FMOPEN).map(fmRow).join("")}</ul></section>`:""}`}
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("[data-fmopen],[data-fmpin]");if(!t)return;e.preventDefault();
  if(t.dataset.fmopen!==undefined){FMOPEN=FMOPEN===t.dataset.fmopen?"":t.dataset.fmopen}
  if(t.dataset.fmpin){const id=t.dataset.fmpin;FMPIN=FMPIN.includes(id)?FMPIN.filter(x=>x!==id):[id].concat(FMPIN);try{localStorage.setItem("hf_fmpin",JSON.stringify(FMPIN))}catch(er){}}
  const b=document.getElementById("fmBody");if(b)b.innerHTML=fmBodyHTML();else render()});
document.addEventListener("input",e=>{if(e.target&&e.target.id==="fmQ"){if(e.isComposing)return;FMQ=e.target.value;const b=document.getElementById("fmBody");if(b)b.innerHTML=fmBodyHTML()}});
document.addEventListener("compositionend",e=>{if(e.target&&e.target.id==="fmQ"){FMQ=e.target.value;const b=document.getElementById("fmBody");if(b)b.innerHTML=fmBodyHTML()}});
function renderForms(){
  return `<div class="head"><div><h1>서식 자료실</h1><p>공유드라이브 「0. 홈퍼니싱」의 본사 서식 원본 · 누르면 바로 미리 보기 · 원본은 고치지 말고 ‘사본 만들기’ 또는 다운로드해서 쓰세요</p></div></div>
  <input id="fmQ" class="search" type="search" placeholder="자료 검색 (예: 휴가, 계약서, 지출)" value="${esc(FMQ)}" autocomplete="off" style="font-size:16px;padding:10px 14px;border:2px solid var(--accent)">
  <div class="secnote">원본 파일은 수정하지 않습니다. 결재가 필요한 서식은 ‘결재로’ 버튼으로 전자결재를 바로 올릴 수 있어요. 링크는 공유드라이브 권한이 있는 사람만 열립니다.</div>
  ${coCardHTML()}${smsCfgCard()}
  <section class="card"><h2>인트라넷에서 바로 만드는 서식 <small class="muted">회사 기본 정보가 자동으로 들어가요</small></h2><div class="chips"><a class="btn sm" href="#quotes">견적서 PDF · 견적 관리 › 견적 열기 › 견적서 출력</a><button class="btn sm" data-newkind="증명서 발급 신청 (재직·경력)">재직·경력증명서 (결재 후 직인)</button>${mode==="shared"&&!me.admin?'<a class="btn sm" href="#myhr">내 급여명세서 PDF</a>':""}</div></section>
  <div class="secnote" style="border-color:#C55A11">본사 원본 서식(아래 링크)에는 <b>예전 회사 정보</b>가 남아 있을 수 있어요. 원본은 고치지 않으니, 사본에 위 ‘회사 기본 정보’로 바꿔 적어 쓰세요.</div>
  <div id="fmBody" style="display:grid;gap:12px">${fmBodyHTML()}</div>
  <div class="foot">ⓒ HOME FURNISHING CO. all rights reserved.</div>`;
}

function flowHTML(d){const cur=flowOf(d.stage,d),i=FLOW_NAMES.indexOf(cur),lost=cur==="미계약 종료",done=d.stage==="종료";
  const bar=FLOW_NAMES.map((n,j)=>`<li class="${!lost&&j<i?"done":""}${!lost&&j===i?" now":""}" ${!lost&&j===i?'aria-current="step"':""}${!lost&&!done?` data-pgo="${esc(n)}" style="cursor:pointer" title="${n==="견적 상담"?"누르면 이 프로젝트 견적서 작성 화면이 열려요":"누르면 이 단계로 옮겨요"}"`:""}><span>${j+1}</span>${esc(n)}</li>`).join("");
  const next=lost||done?"":i<FLOW_NAMES.length-1?FLOW_NAMES[i+1]:"종료";
  const nq=S.quotes.filter(x=>x.pno===d.no).length,ns=S.sites.filter(x=>x.pno===d.no).length;
  const quick=cur==="고객 등록"?`<button class="btn sm" type="button" data-cs="from" data-no="${esc(d.no)}">상담 진행 화면 열기</button>`:cur==="견적 상담"?`<button class="btn sm" type="button" data-pnew="quotes">+ 견적 (${esc(nextQno(d.no))})</button><button class="btn sm" type="button" data-cs="from" data-no="${esc(d.no)}">공간별로 고르기 (상담 진행)</button>`:cur==="디자인 상담"?`<span class="hint">아래 ‘시안 이미지 만들기’ ▼</span>`:cur==="계약"?(pcCan(S.projects.find(x=>x.no===d.no))?`<button class="btn sm" type="button" data-pctop="1">원가 관리 (견적·실행·사후)</button>`:""):(cur==="진행(공정)"||cur==="현장 관리")?(ns?S.sites.filter(x=>x.pno===d.no).map(x=>`<button class="btn sm" type="button" data-open="sites" data-id="${esc(x.id)}">현장 열기 · ${esc(x.status||"")}</button>`).join(""):""):(cur==="준공"||cur==="사후관리")?`<button class="btn sm" type="button" data-pnew="as">+ A/S 접수</button>`:"";
  return `<div class="flow"><ol class="flowbar" aria-label="업무 단계">${bar}</ol>
  ${lost?`<p class="flowtodo"><b>미계약 종료</b> · 사유: ${esc(d.lost||"—")} · 다시 진행하려면 아래 ‘단계’를 바꿔 저장해요.</p>`:done?`<p class="flowtodo"><b>종료된 프로젝트</b>예요.</p>`:`<p class="flowtodo"><b>지금 할 일 · ${esc(cur)}</b> ${esc(FLOW_TODO[cur]||"")} <span class="hint">견적 ${nq}건 · 현장 ${ns}건</span></p>`}
  <div class="chips">${!lost&&!done&&i>0?`<button class="btn sm" type="button" data-pback="${esc(FLOW_NAMES[i-1])}">◀ 이전 단계로: ${esc(FLOW_NAMES[i-1])}</button>`:""}${quick}${next?`<button class="btn pri" type="button" data-pflow="${esc(next)}">다음 단계로: ${esc(next)} ▶</button>`:""}${!lost&&i<=3&&!done?`<button class="btn sm" type="button" data-pflow="미계약 종료">미계약 종료</button>`:""}</div></div><div id="pjProc">${pjProcHTML(d)}</div>`}
// ===== 프로젝트 통합 화면 (대표 지시 2026-11-12, v0.99-26) =====
// 프로젝트 상세 맨 위: 연결된 고객 / 현장 진행 상황 / 견적 / 사후관리 카드 4개 (누르면 그 메뉴의 상세 화면). 연결은 기존 프로젝트 번호(P-…)·고객코드(C-…) 그대로
// 돈: 견적 금액(판매가)·계약 금액만, 금액 미확정이면 숨김. 원가·마진·성과금·A/S 비용은 넣지 않음. 직원 화면에서 내 담당이 아닌 줄은 목록과 같은 방식으로 가림
const hubV=(col,r)=>(!me.admin&&mode==="shared"&&r&&!r.__masked&&!rowMine(col,r))?maskRow(col,r):r;
const hubMon=q=>{try{return amtLocked(q)&&!canMoney()?"금액 미확정":(num(q.amount)?won(q.amount):"")}catch(e){return ""}};
function hubSite(s){const L=(s.logs||[]).filter(l=>l&&l.d).sort((a,b)=>String(b.d).localeCompare(String(a.d)))[0];return {pg:Math.max(0,Math.min(100,num(s.progress))),proc:s.proc||"",last:L?(String(L.d).slice(5,10)+" "+(L.proc?L.proc+" · ":"")+String(L.text||"").slice(0,40)):""}}
function hubParts(p){const byD=(a,b)=>String(b.d||b.createdAt||"").localeCompare(String(a.d||a.createdAt||""));
  return {cu:S.customers.filter(c=>(c.code&&p.custCode&&c.code===p.custCode)||(c.linkedPno&&c.linkedPno===p.no)),si:S.sites.filter(x=>p.no&&x.pno===p.no),qu:S.quotes.filter(x=>p.no&&x.pno===p.no).sort(byD),as:(S.as||[]).filter(x=>p.no&&x.pno===p.no).sort(byD)}}
const hubItem=(col,id,html,x)=>`<button type="button" class="hubi" data-open="${col}" data-id="${esc(id)}"${x||""}>${html}</button>`;
function hubSiteHTML(s0){const s=hubV("sites",s0),g=hubSite(s0);return hubItem("sites",s0.id,`<b>${esc(s.name||"현장")}</b> <span class="pill">${esc(s.status||"")}</span><small>공정 ${esc(g.proc||"—")} · 진행률 ${g.pg}%</small><div class="hubbar" role="img" aria-label="진행률 ${g.pg}%"><i style="width:${g.pg}%"></i></div><small>마지막 일지: ${esc(g.last||"아직 없음")}</small>`)}
function hubQuoteHTML(q0){const q=hubV("quotes",q0),m=q.__masked?"":hubMon(q0);return hubItem("quotes",q0.id,`<b>${esc(q.qno||q.ver||"견적")}</b> <span class="pill">${esc(q.status||"")}</span><small>${esc(q.d||"")}${m?" · "+esc(m):""}</small>`,' data-qfmt="1"')}
function hubAsHTML(a){return hubItem("as",a.id,`<b>${esc(String(a.content||a.site||"A/S").slice(0,30))}</b> <span class="pill ${a.status==="완료"?"ok":"warn"}">${esc(a.status||"접수")}</span><small>접수 ${esc(a.d||"")}${a.done?" · 처리 "+esc(a.done):""}${a.mgr?" · 담당 "+esc(a.mgr):""}</small>`)}
function hubWarr(p){const T=todayStr();if(p.warrantyEnd)return `<small>하자보수 ${esc(p.warrantyEnd)}까지 <span class="pill ${p.warrantyEnd<T?"":"ok"}">${p.warrantyEnd<T?"기간 끝":"기간 중"}</span></small>`;if(p.end&&["준공","사후관리","종료"].includes(p.stage)){try{return `<small>준공 ${esc(p.end)} · 1개월 점검 ${esc(addMon(p.end,1))} · 1년 점검 ${esc(addMon(p.end,12))}</small>`}catch(e){}}return ""}
function hubHTML(p){if(!p||!p.no)return "";const H=hubParts(p),pv=hubV("projects",p),more=(n,k)=>n>4?`<small>외 ${n-4}건 · <a href="#${k}">${k==="quotes"?"견적 관리":"사후 관리"}에서 전체 보기</a></small>`:"";
  const cu=H.cu.length?H.cu.map(c0=>{const c=hubV("customers",c0);return hubItem("customers",c0.id,`<b>${esc(c.name||"")}</b><small>${esc(c.code||"")}${c.tel?" · "+esc(c.tel):""}${c.mgr?" · 담당 "+esc(c.mgr):""}</small><small>${esc((STAGES.find(x=>x[0]===stageOf(c0).stage[0])||[0,""])[1])}${c.addr?" · "+esc(c.addr):""}</small>`)}).join(""):`<small>연결된 고객 카드가 없어요${pv.custName?" · 프로젝트에 적힌 고객: "+esc(pv.custName):""}</small>`;
  const si=H.si.length?H.si.map(hubSiteHTML).join(""):`<small>아직 현장이 없어요 · 계약 단계로 넘기면 만들어져요</small>`;
  const qu=H.qu.length?H.qu.slice(0,4).map(hubQuoteHTML).join("")+more(H.qu.length,"quotes"):`<small>아직 견적이 없어요</small>`;
  const as=(H.as.length?H.as.slice(0,4).map(hubAsHTML).join("")+more(H.as.length,"as"):`<small>접수된 A/S가 없어요</small>`)+hubWarr(p);
  return `<section class="hub" id="pjHub" aria-label="이 프로젝트에 연결된 것"><div class="hubc"><h4>고객 정보 <span class="pill">${H.cu.length}</span></h4>${cu}</div><div class="hubc"><h4>현장 진행 상황 <span class="pill">${H.si.length}</span></h4>${si}</div><div class="hubc"><h4>견적 <span class="pill">${H.qu.length}</span></h4><button type="button" class="btn sm pri" data-pqenter="${esc(p.no)}" style="width:100%;min-height:40px;margin:2px 0 4px">${H.qu.length?"견적서 작성 열기":"+ 견적 1차 만들기"}</button><small>홈퍼니싱 견적서_ver1 양식 (공종별) · 단가 미정 → 단가 첨부</small>${qu}</div><div class="hubc"><h4>사후관리 (점검·A/S) <span class="pill">${H.as.length}</span></h4><button type="button" class="btn sm" data-acgo="${esc(p.no)}" style="width:100%;margin:2px 0 4px">사후 관리 화면 열기 (하자·점검·연락)</button>${as}</div></section>`}
// 고객 카드·검색 결과: 이 고객의 모든 것 (프로젝트가 여러 개면 프로젝트별로)
function custHubHTML(c,head){if(!c)return "";const P=S.projects.filter(p=>canSeeRow("projects",p)&&((c.code&&p.custCode===c.code)||(c.linkedPno&&p.no===c.linkedPno))).sort((a,b)=>String(b.no||"").localeCompare(String(a.no||"")));const nos=new Set(P.map(p=>p.no));
  const lq=c.code?S.quotes.filter(q=>q.code===c.code&&!nos.has(q.pno)):[],ls=c.code?S.sites.filter(x=>x.code===c.code&&!nos.has(x.pno)):[];const cv=hubV("customers",c);
  const blocks=P.map(p=>{const H=hubParts(p),pv=hubV("projects",p);return `<div class="hubp"><div class="hubh"><button type="button" class="btn sm pri" data-open="projects" data-id="${esc(p.id)}">${esc(p.no||"")} · ${esc(pv.title||pv.custName||"")}</button><span class="pill info">${esc(flowOf(p.stage,p))}</span>${p.mgr?`<small class="muted">담당 ${esc(p.mgr)}</small>`:""}</div>
    <div class="hub" style="margin:6px 0 0"><div class="hubc"><h4>현장 진행 상황 <span class="pill">${H.si.length}</span></h4>${H.si.length?H.si.map(hubSiteHTML).join(""):"<small>아직 현장이 없어요</small>"}</div><div class="hubc"><h4>견적 <span class="pill">${H.qu.length}</span></h4>${H.qu.length?H.qu.slice(0,3).map(hubQuoteHTML).join("")+(H.qu.length>3?`<small>외 ${H.qu.length-3}건</small>`:""):"<small>아직 견적이 없어요</small>"}</div><div class="hubc"><h4>사후관리 <span class="pill">${H.as.length}</span></h4>${(H.as.length?H.as.slice(0,3).map(hubAsHTML).join(""):"<small>접수된 A/S가 없어요</small>")+hubWarr(p)}</div></div></div>`}).join("");
  const loose=(lq.length||ls.length)?`<div class="hubp"><div class="hubh"><span class="pill warn">프로젝트 없음</span><small class="muted">프로젝트에 묶이지 않은 견적·현장이에요</small></div>${lq.map(hubQuoteHTML).join("")}${ls.map(hubSiteHTML).join("")}</div>`:"";
  return `<section class="card custHub" aria-label="이 고객의 모든 것"><h3 style="margin:0 0 4px">${head?`<button type="button" class="btn sm" data-open="customers" data-id="${esc(c.id)}">${esc(cv.name||"")} 고객 카드</button> `:""}이 고객의 모든 것 <small class="muted" style="font-weight:400">프로젝트 ${P.length}건${cv.code?" · "+esc(cv.code):""}</small></h3>${blocks||loose?blocks+loose:`<p class="hint">아직 이 고객의 프로젝트가 없어요 · <a href="#projects">프로젝트</a>에서 ‘문의 접수’로 시작해요</p>`}</section>`}
// 고객 관리·프로젝트에서 고객 이름으로 찾았을 때: 그 고객의 프로젝트·현장 진행 상황·견적·사후관리를 한 화면에 (3명까지)
function hubSearchHTML(k){if(!query||!["customers","projects"].includes(k))return "";const q=String(query).toLowerCase().trim();if(q.length<2)return "";
  const L=S.customers.filter(c=>canSeeRow("customers",c)&&String(hubV("customers",c).name||"").toLowerCase().includes(q));if(!L.length)return "";

function smsPick(list){const ok=[],skip=[],seen=new Set();(list||[]).forEach(c=>{if(!c)return;const nm=c.name||c.code||"고객";
    if(c.__masked||(!me.admin&&!rowMine("customers",c))){skip.push({name:nm,why:"담당 고객이 아니라 전화번호를 볼 수 없어요"});return}

    if(seen.has(t)){skip.push({name:nm,why:"같은 번호가 이미 있어요 ("+smsTelFmt(t)+")"});return}

function smsCheck(M){const rows=M.targets.map(c=>{const msg=smsFill(M.text,c);return {c,msg,bytes:smsBytes(msg),type:smsType(msg)}}),warn=[],block=[];

  if(!raw)block.push("보낼 글을 적어 주세요");
  if(rows.some(r=>r.bytes>SMS_MAXB))block.push("글이 너무 길어요 ("+SMS_MAXB+"바이트까지)");
  const left=[...new Set(one.match(/\{[^{}\n]{1,12}\}/g)||[])];if(left.length)warn.push("바뀌지 않은 자리 표시가 그대로 나가요: "+left.join(" "));

  if(ad){const adBad=[];if(!/^\(광고\)/.test(one))adBad.push("광고 문자는 맨 앞에 (광고) 를 적어야 해요");
    if(!smsCfg().optout)adBad.push("수신거부 번호를 설정에 넣어 주세요 (서식 자료실 › 문자 발송 › 무료 수신거부 번호)");
    else if(!/무료\s*수신거부\s*080[\d-]{7,}\s*$/.test(one))adBad.push("광고 문자는 맨 끝에 ‘무료수신거부 "+smsCfg().optout+"’ 를 적어야 해요");

  const title=todayStr()+" "+(f.name||entry.name||"첨부");const r=await mcpCap.callTool("Google Drive","create_file",{title,parentId:folder,base64Content:b64,contentMimeType:f.type||entry.type||"application/octet-stream",disableConversionToGoogleType:true});const d=mcpId(r);if(!d.id)throw new Error("no id");
  entry.drive={id:d.id,folder,url:d.url||("https://drive.google.com/file/d/"+d.id+"/view"),at:nowISO()};drawFiles();toast("드라이브 "+pno+" 폴더에도 저장했어요 · 저장을 눌러 주세요")}
 catch(e){entry.driveErr=String((e&&(e.code||e.message))||"실패").slice(0,60);if(!attWarned){attWarned=true;toast("첨부는 됐어요 · 드라이브 폴더 복사는 못 했어요 (claude.ai에서 구글 드라이브 연결·현장 공유드라이브 편집 권한 확인)")}}}
